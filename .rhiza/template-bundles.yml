# Rhiza Template Bundle Definitions
#
# This file defines two layers of configuration:
#
# 1. bundles: atomic, file-owning building blocks.
#    Every synced file belongs to exactly one bundle. Feature bundles are
#    local-first — they do not include hosted workflow files. GitHub Actions
#    workflow files (thin wrappers that delegate to reusable workflows in
#    jebel-quant/rhiza) live in dedicated github-<feature> overlay bundles.
#
#    File ownership is expressed through the filesystem: each bundle has a
#    corresponding directory under bundles/<name>/ in this repository (28 bundles).
#    Symlinks point to the real files; overlay bundles (github-*, gitlab-*)
#    contain the actual injection files directly.
#
# 2. profiles: higher-level named presets that expand to a set of bundles.
#    Profiles represent stable user intents (local-only, GitHub-hosted, etc.)
#    and do not own files directly.
#
# Usage in downstream projects (.rhiza/template.yml):
#
#   # Profile-based (recommended — picks a sensible bundle set for your context):
#   profiles:
#     - local
#
#   # Bundle-based (advanced — full manual control):
#   templates:
#     - core
#     - tests
#     - github
#
#   # Mixed (profile plus extra bundles):
#   profiles:
#     - github-project
#   templates:
#     - marimo

# Bundle Definitions
bundles:
  # ============================================================================
  # CORE - Required infrastructure
  # ============================================================================
  core:
    description: "Core Rhiza infrastructure (language-neutral)"
    required: true
    standalone: true
    notes: |
      The front door (`Makefile` — a 71-line shim that pins `RHIZA_TASK` and
      forwards every unmatched target to that CLI), editor config, changelog
      config, and uv/uvx as a *tool runner* (rhiza runs pre-commit, mkdocs and
      semgrep through uvx whatever the project is written in). The framework the
      Makefile used to *be* — `rhiza.mk`, `make.d/`, the help and logo machinery,
      the shell and GNU-make guards — is rhiza-task now. It is deliberately not a
      working repo on its own: `install` and `all` come from a language layer, and
      every profile pairs core with exactly one.

      The Makefile is template-owned, so a sync overwrites it and `RHIZA_TASK`
      travels with the template. Repo-owned targets go in `local.mk`, which the
      Makefile `-include`s and core deliberately does not ignore.

      It ships **no** `.rhiza/.env`. The one it used to ship set SOURCE_FOLDER and
      MARIMO_FOLDER to values identical to `rhiza.mk`'s own `?=` defaults, so it
      carried no information — while a makefile assignment outranks an exported
      environment variable in GNU make, so naming a variable there removed it from
      every caller's reach. That is the mechanism of #1545, where a pinned
      RHIZA_CI_OS_MATRIX silently discarded `rhiza_ci.yml`'s per-caller export. The
      file itself stays supported — a consumer's own copy is layer 2 of rhiza-task's
      resolution order, read by the CLI rather than by make — and the documented home
      for project settings is a `[tool.rhiza-task]` table in pyproject.toml, layer 3.

  # ============================================================================
  # LANGUAGE LAYERS - exactly one per repo
  # ============================================================================
  python-core:
    description: "Python toolchain layer: virtualenv, uv sync, ruff/bandit config, and the Python gate set"
    standalone: true
    layer: language
    requires: [core]
    notes: |
      The Python half of what used to be `core`: `.python-version`, `ruff.toml`,
      `.bandit`, the pre-commit config, and `pytest.ini`. Its gates are rhiza-task tasks.

      The gate set it names — `install`, `test`, `coverage`, `typecheck`, `security`,
      `deps`, `license`, `docs-coverage`, `all` — is the same set `rust-core` and
      `go-core` name, with a different engine behind each. That parity used to live in
      three synced fragments and lives in rhiza-task's task registry now, keyed by
      layer, so which one answers to a bare `test` is decided by the manifests a
      repository actually has rather than by which fragment was synced into it.

      A language layer owns the target *names* the rest of the template calls —
      `install`, `all` — so the book tasks and the CI workflows never need to know the
      language. Sibling layers claim the same deployment paths on purpose: selecting
      two at once is a file-ownership conflict, which is the intended way for "one
      language per repo" to fail loudly.

      Unlike the Rust and Go layers it ships **no** bump-my-version config, and
      that is deliberate (issue #1453). bump-my-version auto-discovers exactly four
      filenames — `.bumpversion.toml`, `.bumpversion.cfg`, `setup.cfg`,
      `pyproject.toml` — and a Python project already owns the last one, where a
      `[tool.bumpversion]` table rewrites PEP 621 `[project].version` natively. A
      synced `.bumpversion.toml` would *shadow* that table, and the
      `.rhiza/.cfg.toml` this layer used to ship was never read at all: with no
      config found bump-my-version does not fail, it falls back to `git describe`.
      Each repo therefore declares its own three-line block, and this layer's own
      `RHIZA_CHECKS` contribution — pytest-rhiza's `test_pyproject`, run by
      `make rhiza-test` — fails when it is missing. The Rust and Go layers name the
      equivalent check for their manifests.

  rust-core:
    description: "Rust toolchain layer: rustup/cargo, clippy, nextest, llvm-cov, cargo-deny"
    standalone: true
    layer: language
    requires: [core]
    notes: |
      The Rust sibling of `python-core`. Ships `rust-toolchain.toml`,
      `rustfmt.toml`, `clippy.toml`, `deny.toml`, a Rust pre-commit config and a
      `.bumpversion.toml` pointing at `Cargo.toml`/`Cargo.lock`. Its gates are
      rhiza-task tasks rather than a synced `rust.mk`.

      The bump-my-version config sits at the repo root, not in `.rhiza/`, because
      those are the only paths the tool searches (issue #1453) — and unlike Python,
      Rust owns none of them, so the layer has to ship one. It carries no
      `current_version`: a synced file must not own a value only the consuming repo
      can maintain, so the version is read from the newest `v*` tag instead.

      It carries the test targets, as all three layers now do — Python's moved into
      `python-core` in #1475. What stays out of every layer is the optional extras
      the `tests` bundle keeps (benchmarks, hypothesis, stress), and Rust
      has no equivalent: `test`, `coverage` and `typecheck` are cargo subcommands
      with nothing to configure, so a `rust-tests` bundle would own no files at all.

      `typecheck` is clippy: rustc already type-checks, so the analogous gate is
      the lint pass that runs after it. `docs-coverage` is `RUSTDOCFLAGS`
      `-D missing_docs`, which is pass/fail rather than a percentage — there is no
      Rust interrogate, so COVERAGE-style thresholds do not apply.

  go-core:
    description: "Go toolchain layer: go mod, go test, golangci-lint, govulncheck, revive"
    standalone: true
    layer: language
    requires: [core]
    notes: |
      The Go sibling of `python-core` and `rust-core`. Ships `.golangci.yml`,
      `revive.toml`, a Go pre-commit config, a root `.bumpversion.toml` (see
      `rust-core` for why it is not in `.rhiza/`), and a starter
      `internal/version/version.go` with its `version_test.go`. Its gates are
      rhiza-task tasks rather than a synced `go.mk`.

      Like Rust it carries its own test targets: `go test` and `go tool cover`
      need no configuration files, so a `go-tests` bundle would own nothing but
      the gates.

      The shipped test is what keeps those gates honest. `go test ./...` prints
      "[no test files]" for a package without one and exits 0, so a fresh Go repo
      passed `make test` while running nothing. Rust is spared because
      `cargo init --lib` leaves an `it_works` test behind; `go mod init` writes no
      Go file at all, so the layer brings the first test itself.

      `install` is only `go mod download` — go.mod's `go`/`toolchain` directives
      make the go command fetch a matching compiler itself, so there is no rustup
      step to mirror. `typecheck` is `go vet` plus golangci-lint, since the
      compiler already type-checks. `docs-coverage` is revive's `exported` rule:
      pass/fail on missing doc comments, like Rust's `-D missing_docs` and unlike
      interrogate's percentage.

      The version location is the one real difference between Go and its
      siblings. A Go module's version is its git tag — pyproject.toml and
      Cargo.toml have no equivalent in the source tree — so the layer ships a
      `version.Version` constant for bump-my-version to write to, and the
      release commit and its tag move together.

  github:
    description: "GitHub repository configuration (actions, dependabot, templates, rulesets, core workflows)"
    standalone: true
    requires: [core]

  # ============================================================================
  # RENOVATE - Automated dependency updates
  # ============================================================================
  renovate:
    description: "Renovate bot configuration for automated dependency updates"
    standalone: true
    requires: []

  # ============================================================================
  # LEGAL - Legal and community files
  # ============================================================================
  legal:
    description: "Legal and community documentation files"
    standalone: true
    requires: []

  # ============================================================================
  # VSCODE - VS Code recommended extensions and workspace settings
  # ============================================================================
  vscode:
    description: "VS Code recommended extensions and workspace settings for local (non-container) editing"
    standalone: true
    requires: []

  # ============================================================================
  # DEVCONTAINER - VS Code DevContainer configuration
  # ============================================================================
  devcontainer:
    description: "VS Code DevContainer configuration for consistent development environments"
    standalone: true
    requires: []
    recommends:
      - github-devcontainer  # Add the GitHub Actions workflow for devcontainer image build validation

  # ============================================================================
  # GITHUB-DEVCONTAINER - GitHub Actions workflow for devcontainer CI
  # ============================================================================
  github-devcontainer:
    description: "GitHub Actions workflow stub for devcontainer image build validation"
    standalone: true
    requires: [devcontainer, github]

  # ============================================================================
  # DOCKER - Docker containerization support
  # ============================================================================
  docker:
    description: "Docker containerization support for building and running containers"
    standalone: true
    requires: []

  # ============================================================================
  # GITHUB-DOCKER - GitHub Actions workflow for Docker lint and build validation
  # ============================================================================
  github-docker:
    description: "GitHub Actions workflow stub for Docker lint, build, and security scan"
    standalone: true
    requires: [docker, github]

  # ============================================================================
  # LFS - Git Large File Storage support
  # ============================================================================
  lfs:
    description: "Git LFS (Large File Storage) installation and management"
    standalone: true
    requires: []

  # ============================================================================
  # PRESENTATION - Presentation building with Marp
  # ============================================================================
  presentation:
    description: "Presentation slides built from PRESENTATION.md using Marp"
    standalone: true
    requires: []
    recommends:
      - marimo  # Presentations often use Marimo for interactive slides

  # ============================================================================
  # PAPER - LaTeX paper compilation targets
  # ============================================================================
  paper:
    description: "LaTeX paper compilation targets (make paper, make paper-clean)"
    standalone: true
    requires: []

  # ============================================================================
  # GITHUB-PAPER - GitHub Actions workflow for LaTeX paper compilation
  # ============================================================================
  github-paper:
    description: "GitHub Actions workflow stub for LaTeX paper compilation and PDF publishing"
    standalone: true
    requires: [paper, github]

  # ============================================================================
  # GITLAB - GitLab CI/CD pipeline configuration
  # ============================================================================
  gitlab:
    description: "GitLab CI/CD pipeline configuration and core workflows (sync, release, weekly)"
    standalone: true
    requires: [core]
    notes: |
      GitLab workflows provide similar functionality to GitHub Actions.
      Add gitlab-tests, gitlab-marimo, or gitlab-book for feature-specific pipelines.

  # ============================================================================
  # GITLAB-TESTS - GitLab CI pipeline for testing
  # ============================================================================
  gitlab-tests:
    description: "GitLab CI pipeline for running tests (rhiza_ci)"
    standalone: true
    requires: [tests, gitlab]

  # ============================================================================
  # GITLAB-MARIMO - GitLab CI pipeline for Marimo notebooks
  # ============================================================================
  gitlab-marimo:
    description: "GitLab CI pipeline for Marimo notebook execution"
    standalone: true
    requires: [marimo, gitlab]

  # ============================================================================
  # GITLAB-BOOK - GitLab CI pipeline for book/docs publishing
  # ============================================================================
  gitlab-book:
    description: "GitLab CI pipeline for book/docs publishing to GitLab Pages"
    standalone: true
    requires: [book, gitlab]

  # ============================================================================
  # GITLAB-QUALITY-REVIEW - Advisory agentic design review (Claude Code, GitLab)
  # ============================================================================
  gitlab-quality-review:
    description: "GitLab CI job for an advisory Claude design review of MR diffs (opt-in)"
    standalone: true
    requires: [core, gitlab]
    notes: |
      GitLab counterpart of github-quality-review. Opt-in only, and deliberately
      NOT part of any profile. On merge-request pipelines it runs an advisory
      Claude design review of the diff via the headless claude CLI — covering
      only what the deterministic gates cannot: architecture/design fit,
      unnecessary complexity, and test-coverage gaps. It does NOT re-run
      fmt/typecheck/deptry/security/validate/test; the CI + quality pipelines
      already run those. The review is posted as a merge-request note when a
      token with `api` scope is available (CLAUDE_REVIEW_GITLAB_TOKEN, falling
      back to CI_JOB_TOKEN), and always echoed to the job log. The job is
      allow_failure so it never blocks the MR.
      Cost & privacy: spends Anthropic API tokens per run and sends diff context
      to the Anthropic API. Stays dormant until BOTH the
      CLAUDE_QUALITY_REVIEW_ENABLED CI/CD variable is 'true' AND the
      ANTHROPIC_API_KEY CI/CD variable is set (masked).

  # ============================================================================
  # TESTS - Optional Python testing extras (benchmarks, hypothesis, stress)
  # ============================================================================
  tests:
    description: "Optional Python testing extras: benchmark, hypothesis-test and stress gates"
    standalone: true
    requires:
      - book          # ships docs/development/TESTS.md, which needs the book's docs/ tree
      - core
      - python-core   # the extras read TESTS_FOLDER and pytest.ini from the layer
    notes: |
      Carries only the gates that no layer's `all` depends on. The four that it does
      name — `test`, `typecheck`, `security`, `docs-coverage` — moved into
      `python-core` in #1475, along with `pytest.ini` and the Python-only rhiza checks.

      The reason is that `python.mk`'s own `all` named them while this bundle defined
      them, and nothing made this bundle arrive: the dependency runs the other way.
      A project syncing `core + python-core` therefore had an `all` that died on a
      missing rule, while `core + rust-core` and `core + go-core` were self-contained.
      No shipped profile reached it — all three Python profiles select `tests` — which
      is why it went unnoticed;
      `test_bundle_sync.py::TestALayersAllIsSatisfiableOnItsOwn` now pins the property
      for every layer.

      What is left is genuinely optional: three gates, each needing its own tool and
      folder convention (benchmarks, Hypothesis property tests, stress/load tests),
      plus one line of `RHIZA_CHECKS` naming pytest-rhiza's
      `test_readme_validation` — the half of the README checks that only means something
      on a Python project, its neutral half having moved to `core` in #1472. That was a
      synced file until #1540; the ownership is unchanged, only the delivery.

      **There was a fourth, and mutation testing is deliberately not offered any more**
      (#1492). `mutation` had been broken in every consumer since mutmut 3 shipped: the
      recipe passed `--paths-to-mutate`, `--tests-dir` and called `mutmut html`, all
      three removed, and it installed mutmut unpinned — so the breakage was
      time-triggered rather than arriving by sync. Porting it is not a flag rename.
      mutmut 3.x resolves source paths during config loading with no CLI path at all, so
      a task would have to require `[tool.mutmut]` in every consumer's `pyproject.toml`
      or write one behind their back; `tests_dir` is itself already deprecated in favour
      of `pytest_add_cli_args_test_selection`; the HTML report the recipe relocated no
      longer exists; and `results` prints nothing when nothing survived. That is a new
      config contract with consumers, for a gate no `all` names and no workflow ran —
      `rhiza_mutation.yml` went in #1583 because `MUTATION_ENABLED` was unset here and
      everywhere we could see. Removal of the task itself is Jebel-Quant/rhiza-task#135.

  # ============================================================================
  # GITHUB-TESTS - GitHub Actions workflows for CI
  # ============================================================================
  github-tests:
    description: "GitHub Actions workflow stubs for CI (rhiza_ci, rhiza_codeql, rhiza_benchmark)"
    standalone: true
    requires: [tests, github]

  # ============================================================================
  # BENCHMARKS - Performance benchmarking with pytest-benchmark
  # ============================================================================
  benchmarks:
    description: "Performance benchmarking infrastructure with pytest-benchmark and reporting"
    standalone: false
    requires:
      - tests  # Required: benchmarks depend on the test infrastructure (and, through it, python-core)

  # ============================================================================
  # MARIMO - Interactive Marimo notebooks
  # ============================================================================
  marimo:
    description: "Interactive Marimo notebooks for data exploration and documentation"
    standalone: false
    requires:
      - book
      - core
      - python-core   # marimo is a Python package

  # ============================================================================
  # GITHUB-MARIMO - GitHub Actions workflow for Marimo notebooks
  # ============================================================================
  github-marimo:
    description: "GitHub Actions workflow stub for Marimo notebook publishing"
    standalone: true
    requires: [marimo, github]

  # ============================================================================
  # BOOK - Documentation book generation
  # ============================================================================
  book:
    description: |
      Comprehensive documentation book generation combining:
      - Documentation site (MkDocs + zensical)
      - Interactive notebooks (if marimo is enabled)
      - Test coverage reports and results (if tests bundle is also enabled)
    standalone: true
    requires:
      - core
    recommends:
      - tests   # Optional: book includes coverage and test reports when tests are enabled
      - marimo  # Optional: book works better with notebook exports

  # ============================================================================
  # GITHUB-BOOK - GitHub Actions workflow for book/docs publishing
  # ============================================================================
  github-book:
    description: "GitHub Actions workflow stub for book/docs publishing to GitHub Pages"
    standalone: true
    requires: [book, github]

  # ============================================================================
  # GITHUB-QUALITY-REVIEW - Advisory agentic quality scorecard (Claude Code)
  # ============================================================================
  github-quality-review:
    description: "GitHub Actions workflow stub for an advisory Claude design review of PR diffs (opt-in)"
    standalone: true
    requires: [core, github]
    notes: |
      Opt-in only, and deliberately NOT part of any profile. On each pull
      request this runs an advisory Claude design review of the diff — covering
      only what the deterministic gates cannot: architecture/design fit,
      unnecessary complexity, and test-coverage gaps. It deliberately does NOT
      re-run fmt/lint/typecheck/test/deptry/security; rhiza_ci already runs those
      deterministically, so re-running them here would only waste tokens.
      Cost & privacy: it spends Anthropic API tokens on every run and sends diff
      context to the Anthropic API. It stays dormant until BOTH the
      CLAUDE_QUALITY_REVIEW_ENABLED variable is 'true' AND the ANTHROPIC_API_KEY
      secret is set (an org-level secret is the cleanest distribution).
      Do not add it to a branch-protection required-checks set — it is advisory.

# ==============================================================================
# PROFILE DEFINITIONS
#
# Profiles are higher-level named presets that expand to a set of bundles.
# They represent stable user intents (local-only, GitHub-hosted, etc.) and do
# not own files directly.
#
# Rules:
#   - profiles reference bundles only, not raw file paths
#   - selecting a profile is equivalent to selecting all its constituent bundles
#   - users may combine profiles with additional manual bundle selection
#
# Usage in .rhiza/template.yml:
#
#   profiles:
#     - local
#
#   # or combined with extra bundles:
#   profiles:
#     - github-project
#   templates:
#     - marimo
#     - github-marimo
# ==============================================================================
profiles:

  # ============================================================================
  # LOCAL - Local-first development with no hosted workflows
  # ============================================================================
  local:
    description: |
      Local-first development setup with no hosted CI/CD workflow files.
      Suitable for:
        - experiments and research codebases
        - early-stage projects not yet ready for hosted automation
        - projects hosted privately or on platforms other than GitHub/GitLab
      Includes core infrastructure, testing tooling, and documentation.
      No .github/workflows/* files are synced.
    bundles:
      - core
      - python-core
      - book
      - marimo
      - tests

  # ============================================================================
  # RUST-LOCAL - Local-first Rust development
  # ============================================================================
  rust-local:
    description: |
      Local-first Rust setup with no hosted CI/CD workflow files.
      The Rust counterpart of `local`: core infrastructure, the Rust toolchain
      layer (cargo, clippy, nextest, llvm-cov, cargo-deny) and documentation.

      There is deliberately no `rust-github-project` or `rust-gitlab-project`
      yet. Those profiles are made almost entirely of CI workflows, and the
      `github`/`gitlab` bundles currently ship Python ones — a release job that
      runs `uv build` and publishes to PyPI, and a Dependabot config declaring
      the `uv` ecosystem. Adding them to a Rust profile would deliver CI that
      fails on the first run, so they arrive together with the Rust workflows.
    bundles:
      - core
      - rust-core
      - book

  # ============================================================================
  # GO-LOCAL - Local-first Go development
  # ============================================================================
  go-local:
    description: |
      Local-first Go setup with no hosted CI/CD workflow files.
      The Go counterpart of `local`: core infrastructure, the Go toolchain layer
      (go test, golangci-lint, govulncheck, revive) and documentation.

      As with `rust-local`, there is deliberately no `go-github-project` or
      `go-gitlab-project` yet: those profiles are made almost entirely of CI
      workflows, and the `github`/`gitlab` bundles currently ship Python ones —
      a release job that runs `uv build` and publishes to PyPI, and a Dependabot
      config declaring the `uv` ecosystem. They arrive with the Go workflows.
    bundles:
      - core
      - go-core
      - book

  # ============================================================================
  # GITHUB-PROJECT - Standard GitHub-hosted project
  # ============================================================================
  github-project:
    description: |
      Standard GitHub-hosted project.
      Suitable for open-source or team projects hosted on GitHub.
      Includes core infrastructure, GitHub repository configuration,
      testing tooling, documentation, notebooks, and hosted CI workflows.
    bundles:
      - core
      - python-core
      - github
      - book
      - marimo
      - tests
      - github-book
      - github-marimo
      - github-tests

  # ============================================================================
  # GITLAB-PROJECT - Standard GitLab-hosted project
  # ============================================================================
  gitlab-project:
    description: |
      Standard GitLab-hosted project with GitLab CI/CD pipelines.
      Suitable for projects hosted on GitLab.com or a self-hosted GitLab instance.
      Includes core infrastructure, testing tooling, documentation,
      and GitLab CI pipelines. No .github/ files are synced.
    bundles:
      - core
      - python-core
      - gitlab
      - book
      - marimo
      - tests
      - gitlab-book
      - gitlab-marimo
      - gitlab-tests
