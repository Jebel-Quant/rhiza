[project]
name = "rhiza-test"
version = "0.1.0"
description = "Rhiza's conformance suite, run against a rhiza-managed repository."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "packaging>=24.0",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "python-dotenv>=1.0",
]

[project.scripts]
rhiza-test = "rhiza_test.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rhiza_test"]

# The suite ships as package *data*: these are pytest modules executed against the
# consuming repo, not an importable API. Hatchling would exclude test_*.py otherwise.
[tool.hatch.build]
artifacts = ["src/rhiza_test/suite/*.py"]
