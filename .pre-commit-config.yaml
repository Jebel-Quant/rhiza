# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Pin node so pre-commit provisions a compatible runtime instead of using the
# system node. Some npm-based hooks (markdownlint-cli) pull transitive deps that
# reject odd-numbered current node releases (e.g. v25), failing on EBADENGINE.
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^recipe/meta\.yaml$

  - repo: local
    hooks:
      - id: no-python-cache-files
        name: Prevent committing Python cache files
        language: fail
        entry: Python cache files (__pycache__, .pyc, .pyo, .pyd) must not be committed. Run 'make clean' to remove them.
        files: '(/__pycache__/|\.py[cod]$)'

      - id: no-rej-files
        name: Reject .rej files
        entry: "bash -c 'find . -type f -name \"*.rej\" | grep -q . && { echo \"ERROR: .rej files detected\"; find . -type f -name \"*.rej\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --unsafe-fixes ]

      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: bf6d1792b8bc7f6cc93f10cc27735a4cb0c38e47  # frozen: v0.50.1
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: a76b92851fc9eede9f9bc4073eb55202f34eb0df  # frozen: 0.39.0
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

      - id: check-jsonschema
        name: Validate template-bundles.yml
        files: ^\.rhiza/template-bundles\.yml$
        args: ["--schemafile", ".rhiza/template-bundles.schema.json", "--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Security audit of workflows, actions, dependabot and pre-commit configs, in the live
  # .github/ and in bundles/ (what consumers receive). Mother repo only; exceptions and
  # their reasons are in .github/zizmor.yml. --offline keeps the result the same with or
  # without a GH_TOKEN in the environment, locally and in CI; the online audits run weekly
  # in rhiza_weekly.yml's zizmor-online job, which reads its version from this rev.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8  # frozen: v1.33.1
    hooks:
      - id: zizmor
        args: ["--no-progress", "--offline", "--config", ".github/zizmor.yml"]

  # Spell-checking. Mother repo only; allowed words and exclusions are in pyproject.toml's
  # [tool.typos]. --force-exclude makes those exclusions hold for the file names prek
  # passes, which typos otherwise checks regardless.
  - repo: https://github.com/crate-ci/typos
    rev: 276087d9a4f06398b3e04825487805e2d7375888  # frozen: v1.52.2
    hooks:
      - id: typos
        args: ["--force-exclude"]

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 82d21874c3242e4dc27bb47641c996902ef64eef  # frozen: v0.27
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08  # frozen: 1.9.4
    hooks:
      - id: bandit
        # Scope deliberately lives in .bandit, not here — see that file (#1493).
        args: ["--ini", ".bandit"]

  # shellcheck-py as a pinned PyPI wheel, not as a hook repo: installing the hook repo builds
  # from source, and that build downloads the binary from github.com/.../releases/download/,
  # which answered 504 for hours on 2026-11-08 and turned every PR's pre-commit job red. The
  # wheels bundle the binary (linux x86_64, macOS, Windows), so nothing is fetched from GitHub.
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        language: python
        additional_dependencies: ["shellcheck-py==0.11.0.1"]
        entry: shellcheck
        files: '\.sh$'

  - repo: https://github.com/betterleaks/betterleaks
    rev: 39d5bdcf34db54e944facac5cf6e8b03db5e2b99  # frozen: v1.10.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 81f5f4cd875cc74ecfdfae601ae47d3fd200ad8d  # frozen: 0.13.10
    hooks:
      - id: uv-lock

  # Mother-repo override (#1535). The bundle ships `files: ^src/`, which is right for a
  # downstream project and inert here: rhiza ships configuration rather than a runtime
  # library, so it has no src/ and the hook reported "(no files to check)Skipped" on every
  # `make fmt` — a line that reads like a check in the output of the gate this repo runs
  # most. Scoped instead to the folders `make docs-coverage` measures, which is
  # DOCSTRING_FOLDERS (utils, from [tool.rhiza-task].source-folder) plus the test
  # folder that target folds in.
  #
  # The settings live in pyproject.toml's [tool.interrogate], which the `--config` below
  # has always named and which did not exist until now: interrogate falls back to its own
  # defaults for a missing table rather than failing, so the hook was also a *weaker*
  # standard than the gate (fail-under 80, magic and __init__ methods counted). One table,
  # read by both, keeps them from disagreeing.
  - repo: https://github.com/econchick/interrogate
    rev: 4894019dc8876092bc9b6d56878798c550fad998  # frozen: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        files: ^(utils|tests)/.*\.py$

  - repo: https://github.com/Jebel-Quant/rhiza-hooks
    rev: c57784340d04eb7eeb57665f2cb5a93cda1efbea  # frozen: v1.3.2
    hooks:
      - id: check-rhiza-workflow-names
      - id: check-rhiza-config
      - id: check-python-version-consistency
      
