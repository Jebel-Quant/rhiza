# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Pin node so pre-commit provisions a compatible runtime instead of using the
# system node. Some npm-based hooks (markdownlint-cli) pull transitive deps that
# reject odd-numbered current node releases (e.g. v25), failing on EBADENGINE.
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^recipe/meta\.yaml$

  - repo: local
    hooks:
      - id: no-python-cache-files
        name: Prevent committing Python cache files
        language: fail
        entry: Python cache files (__pycache__, .pyc, .pyo, .pyd) must not be committed. Run 'make clean' to remove them.
        files: '(/__pycache__/|\.py[cod]$)'

      - id: no-rej-files
        name: Reject .rej files
        entry: "bash -c 'find . -type f -name \"*.rej\" | grep -q . && { echo \"ERROR: .rej files detected\"; find . -type f -name \"*.rej\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.4'
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --unsafe-fixes ]

      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.0
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

      - id: check-jsonschema
        name: Validate template-bundles.yml
        files: ^\.rhiza/template-bundles\.yml$
        args: ["--schemafile", ".rhiza/template-bundles.schema.json", "--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Scope deliberately lives in .bandit, not here — see that file (#1493).
        args: ["--ini", ".bandit"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.sh$'

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.7.4
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock

  # Mother-repo override (#1535). The bundle ships `files: ^src/`, which is right for a
  # downstream project and inert here: rhiza ships configuration rather than a runtime
  # library, so it has no src/ and the hook reported "(no files to check)Skipped" on every
  # `make fmt` — a line that reads like a check in the output of the gate this repo runs
  # most. Scoped instead to the folders `make docs-coverage` measures, which is
  # DOCSTRING_FOLDERS (utils, from [tool.rhiza-task].source-folder) plus the test
  # folder that target folds in.
  #
  # The settings live in pyproject.toml's [tool.interrogate], which the `--config` below
  # has always named and which did not exist until now: interrogate falls back to its own
  # defaults for a missing table rather than failing, so the hook was also a *weaker*
  # standard than the gate (fail-under 80, magic and __init__ methods counted). One table,
  # read by both, keeps them from disagreeing.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        files: ^(utils|tests)/.*\.py$

  - repo: https://github.com/Jebel-Quant/rhiza-hooks
    rev: v1.2.0  # Use the latest release
    hooks:
      # Migrated from rhiza
      - id: check-rhiza-workflow-names
      # Mother-repo override (#1581). The hook declares `files: ^Makefile$`, and since #1576
      # the root Makefile is a dogfood symlink into bundles/core/ -- git tracks it as mode
      # 120000, and prek classifies a symlink as `symlink` rather than `file`, so a hook
      # carrying pre-commit's default `types: [file]` is never handed it. The pattern
      # therefore matched nothing even under `--all-files`, and the hook printed
      # "(no files to check)Skipped" on every `make fmt` -- another line that reads like a
      # check, the #1535 complaint reached by a different route.
      #
      # The block it maintains had already gone stale: #1580 bumped the pin to rhiza-task
      # 1.1.0, which added `book-nav`, `complexity` and `docs-examples` and gave `book` a
      # `paper` prerequisite, and none of it reached README.md.
      #
      # `always_run` rather than a `types` override, because the hook takes
      # `pass_filenames: false` -- it does not want the path, only the trigger. That also
      # makes it fire when the *task list* changes, which is what actually invalidates the
      # block: the pin lives in the Makefile, but the tasks live in the CLI it names, so
      # keying regeneration on a file changing was never quite right.
      - id: update-readme-help
        always_run: true
      # Additional utility hooks
      - id: check-rhiza-config
      - id: check-python-version-consistency
      # check-makefile-targets asserts a Makefile defines `install`, `test`, `fmt` and
      # `help`, by extracting explicit rules from it. It was enabled here and inert for the
      # same symlink reason as update-readme-help above (#1581) -- but unlike that hook it
      # must stay off, because the shim is incompatible with what it measures:
      #
      #   $ check-makefile-targets Makefile
      #   Makefile:
      #     - Missing recommended targets: fmt, install, test
      #
      # All three work here; they are CLI tasks reached through the `%:` catch-all, which is
      # the whole design of the shim (ADR 0011). A hook that greps for explicit rules cannot
      # see them, so enabling it would print a false warning on every commit -- and it exits
      # 0 without `--strict`, so the warning would never fail anything either.
      #
      # `always_run: true` is *not* the fix. The hook takes filenames, so with no match it
      # loops over an empty list and returns 0: the visible "Skipped" becomes an invisible
      # "Passed", which is strictly worse. tests/api/test_precommit_hook_reachability.py
      # holds the line for both halves.
      # - id: check-makefile-targets
      # check-bumpversion-config asserts that bump-my-version can actually discover this
      # repo's version config (issue #1453) — here, the [tool.bumpversion] table in
      # pyproject.toml. It ships as of v1.1.0 and passes on this repo; it stays off only
      # because pytest-rhiza's test_pyproject check, which `make rhiza-test` runs, already
      # enforces the same invariant one gate later — so enabling it buys an earlier failure,
      # not a new one.
      # - id: check-bumpversion-config
      # check-template-bundles validates a *consumer's* .rhiza/template.yml against the
      # template repo's remote bundle list. The mother repo has no template.yml — it is
      # the template — so the hook is inert here. Disabled in #660 (rhiza-hooks 0.3.0)
      # with no reason recorded.
      # - id: check-template-bundles
