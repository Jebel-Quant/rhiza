# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Pin node so pre-commit provisions a compatible runtime instead of using the
# system node. Some npm-based hooks (markdownlint-cli) pull transitive deps that
# reject odd-numbered current node releases (e.g. v25), failing on EBADENGINE.
default_language_version:
  node: "24.12.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
        args: ['--unsafe']
        exclude: ^recipe/meta\.yaml$

  - repo: local
    hooks:
      - id: no-python-cache-files
        name: Prevent committing Python cache files
        language: fail
        entry: Python cache files (__pycache__, .pyc, .pyo, .pyd) must not be committed. Run 'make clean' to remove them.
        files: '(/__pycache__/|\.py[cod]$)'

      - id: no-rej-files
        name: Reject .rej files
        entry: "bash -c 'find . -type f -name \"*.rej\" | grep -q . && { echo \"ERROR: .rej files detected\"; find . -type f -name \"*.rej\"; exit 1; } || exit 0'"
        language: system
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.16.6'
    hooks:
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix, --unsafe-fixes ]

      # Run the formatter
      - id: ruff-format

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--disable", "MD013"]

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      - id: check-renovate
        args: [ "--verbose" ]

      - id: check-github-workflows
        args: ["--verbose"]

      - id: check-jsonschema
        name: Validate template-bundles.yml
        files: ^\.rhiza/template-bundles\.yml$
        args: ["--schemafile", ".rhiza/template-bundles.schema.json", "--verbose"]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: "0.26"
    hooks:
      - id: validate-pyproject

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        # Scope deliberately lives in .bandit, not here — see that file (#1493).
        args: ["--ini", ".bandit"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        files: '\.sh$'

  - repo: https://github.com/betterleaks/betterleaks
    rev: v1.8.1
    hooks:
      - id: betterleaks

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.9
    hooks:
      - id: uv-lock

  # Mother-repo override (#1535). The bundle ships `files: ^src/`, which is right for a
  # downstream project and inert here: rhiza ships configuration rather than a runtime
  # library, so it has no src/ and the hook reported "(no files to check)Skipped" on every
  # `make fmt` — a line that reads like a check in the output of the gate this repo runs
  # most. Scoped instead to the folders `make docs-coverage` measures, which is
  # DOCSTRING_FOLDERS (utils, from [tool.rhiza-task].source-folder) plus the test
  # folder that target folds in.
  #
  # The settings live in pyproject.toml's [tool.interrogate], which the `--config` below
  # has always named and which did not exist until now: interrogate falls back to its own
  # defaults for a missing table rather than failing, so the hook was also a *weaker*
  # standard than the gate (fail-under 80, magic and __init__ methods counted). One table,
  # read by both, keeps them from disagreeing.
  - repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
      - id: interrogate
        args: [--config=pyproject.toml]
        files: ^(utils|tests)/.*\.py$

  - repo: https://github.com/Jebel-Quant/rhiza-hooks
    rev: v1.3.0  # Use the latest release
    hooks:
      - id: check-rhiza-workflow-names
      - id: check-rhiza-config
      - id: check-python-version-consistency
      
