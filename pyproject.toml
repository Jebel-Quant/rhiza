[project]
name = "rhiza"
version = "1.5.2"
description = "Reusable configuration templates for modern Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Thomas Schmelzer" }
]
keywords = ["templates", "configuration", "ci", "ruff"]
classifiers = [
    # Deliberate PyPI kill-switch: rhiza_release.yml skips publish when this classifier is present.
    # Remove it to enable publishing (after configuring PyPI Trusted Publisher for the repository).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[dependency-groups]
# Since #1380 every *tool* is provisioned where it is used — `uv run --with pytest`,
# `uvx deptry`, `uvx prek` — so a group here earns its place only when something has
# to be present in the project environment itself. Two things qualify, and nothing
# else does: a library the `tests/` suite imports, and a notebook import deptry would
# otherwise report as DEP001. A tool named by a `--with` flag does not, which is what
# retired the `typecheck` group (ty/mypy) in #1484.
#
# That same rule is why there is no `lint` group. It held ruff, interrogate and
# pre-commit until #1330 commented all three out, and every one of them runs through
# prek/uvx now — so what survived was an empty group kept alive by a shipped test
# asserting its own presence. Both are gone as of #1484. A downstream project may
# still declare one; nothing requires it.
test = [
    # Exactly what `tests/` imports. pytest itself is also injected by the `test`
    # target's `--with`, but stays declared so a bare `uv run pytest tests/...` works.
    "pytest>=9,<10",
    "pyyaml>=6.0.1,<7.0",
    "defusedxml>=0.7,<1",
    "packaging>=26,<27",
]
docs = [
    # Load-bearing, and not for running anything: this repo has no src/, so
    # DEPTRY_FOLDERS is docs/notebooks alone and these are the imports `make deps`
    # resolves there. Drop one and deptry reports DEP001.
    # The notebook also pins these via its PEP 723 header.
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples (v0.18+ for streaming, <1.0 for API stability)
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis (v2.4+ includes 2.0 improvements, <3.0 avoids breaking changes)
    "plotly>=6.5.0,<7.0",    # Interactive visualization in notebooks (v6.5+ mature features, <7.0 for API stability)
    "pandas>=3,<3.1",        # Data manipulation for notebook examples (v3+ for modern APIs, <3.1 conservative after major release)
]

[project.urls]
Homepage = "https://github.com/jebel-quant/rhiza"
Repository = "https://github.com/jebel-quant/rhiza"
Issues = "https://github.com/jebel-quant/rhiza/issues"

[tool.bumpversion]
# Authoritative list of every location this repo's own version is written.
# bump-my-version rewrites ONLY the patterns declared here, so a dependency that
# happens to share the version number is never touched. Kept in pyproject.toml
# because that is one of the four filenames bump-my-version auto-discovers
# (.bumpversion.toml, .bumpversion.cfg, setup.cfg, pyproject.toml) — a block
# anywhere else is inert, and inert is silent: with no config found the tool falls
# back to `git describe` rather than failing. That is issue #1453, which is why the
# python-core bundle no longer ships a `.rhiza/.cfg.toml` copy of this block; the
# Rust and Go layers ship a root `.bumpversion.toml` instead, since neither
# language has a discoverable file of its own.
current_version = "1.5.2"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# The release flow commits and tags itself (so the changelog lands in the same
# commit as the bump), so bump-my-version must not do either.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

# Anchored to the [project] table: an unanchored `version = "..."` search would
# also rewrite any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# The live workflows under .github/workflows/ are deliberately NOT listed, and
# neither is any pin of jebel-quant/actions. configure-git-auth lives in that
# separate repo now, pinned by commit SHA, so it carries ITS version, not this
# repo's — a glob here would rewrite an unrelated project's SHA on every bump.
#
# A self-referential pin is what made releases self-blocking before: the branch
# push published workflows referencing a tag of THIS repo that did not exist yet,
# so they failed at `Set up job` and a release PR could never turn its required
# checks green. Pointing at a different repo removes that circularity — the SHA
# already exists when the release commit lands — but only as long as nothing
# below rewrites it.
#
# The bundle stubs synced into downstream repos must reference an existing tag.
[[tool.bumpversion.files]]
glob = "bundles/**/.github/workflows/*.yml"
regex = true
search = '(jebel-quant/rhiza/[^@\s]+)@v\d+\.\d+\.\d+'
replace = '\1@v{new_version}'
ignore_missing_version = true

# uv.lock is deliberately absent: its `name = "rhiza"` entry is regenerated with
# `uv lock` after the bump. A search on the bare version string would also rewrite any
# *dependency* that happens to sit at the same number, and the lock file is full of
# third-party versions this repo does not control.

[tool.rhiza-task]
# Rhiza's own settings for the task runner that replaced the synced make layer. Read as
# layer 4 of rhiza-task's resolution order, above `.rhiza/.env` and below the environment.
#
# `source-folder` is the one entry that is load-bearing rather than a preference. It
# replaces six make accumulators that the retired `.rhiza/make.d/bundles.mk` used to carry
# (TYPECHECK_FOLDERS, BANDIT_FOLDERS, DOCSTRING_FOLDERS, DEPTRY_FOLDERS, SEMGREP_FOLDERS,
# COVERAGE_FOLDERS += utils). They existed because this repo ships configuration rather
# than a library: it has no `src/`, so the default matched nothing and `typecheck`,
# `security`, `deps`, `docs-coverage` and `semgrep` each exited 0 having measured nothing
# (#1505, #1511, #1516) — on the repo that ships those gates to everyone else.
#
# The CLI reads a single `source_folder` per gate rather than a per-gate list, and `utils/`
# is this repo's only non-test Python, so one setting covers what six appends did. Leave it
# set: without it every scoped gate silently measures nothing again.
# tests/utils/test_gate_scope.py asserts the outcome rather than this wiring.
source-folder = "utils"

# DEP004 is "imported but declared as a development dependency". utils/ *is* development
# tooling — it is the code behind `make sync-self` and the drift check — so importing a dev
# dependency there is correct rather than misplaced. The marimo tasks contribute the same
# flag when their folder exists; deptry accepts the repeat, and stating it here keeps utils/
# from silently depending on the marimo bundle staying adopted.
deptry-ignore = ["--ignore", "DEP004"]

# Declared rather than detected. `detect_layers()` infers the layer set from which manifests
# are present and falls back to python when it finds none — runtime manifest-sniffing of the
# kind the sync-time accumulator existed to avoid, where a misconfigured checkout quietly
# gets a different gate set instead of going red. Naming it costs one line and removes the
# inference entirely.
layers = ["python"]

# Restores what the make layer defaulted to. `python.mk` had `TYPECHECKER ?= both`; the CLI
# defaults to `ty` alone, so a bare migration silently dropped `mypy --strict` from this
# repo's typecheck gate — while CLAUDE.md and the README go on describing `make typecheck`
# as "ty and mypy --strict".
#
# `both` is also better here than it was under make. The shell `case` ran the two in
# sequence and let mypy's exit status win, so a ty failure could pass; the CLI loops and
# each run raises, so ty failing stops the gate. Same setting, one fewer way to be green
# while broken.
typechecker = "both"

# Pins the conformance checks, which is the entire purpose of the setting: a repo runs the
# assertions of a known release, not of whatever the checks repo's HEAD says today. The
# override outlives the bump — rhiza-task 1.1.0 still defaults to v0.2.0, so deleting this
# line would *downgrade* the checks by three releases rather than track the newest.
#
# A PyPI version spec, not a git URL. The git form was inherited from rhiza-task's default,
# and it costs a clone on every `rhiza-test` run for no added precision — a tag is as mutable
# as a version is not. It also put the pin out of reach of the one thing that would have
# noticed it ageing: `renovate.json`'s custom manager is a pypi datasource, and a git ref is
# not a version it can compare.
#
# 0.3.0 collects the same five modules and the same 34 checks as 0.2.1 on this repo, so this
# is a bump of the assertions' *implementation*, not of the check set.
pytest-rhiza = "pytest-rhiza==0.4.0"

# Restores this repo's own book override, which the migration to the shim dropped. The old root
# Makefile carried `MKDOCS_EXTRA_PACKAGES = --with 'mkdocstrings[python]'` above the include, and
# replacing that file with the shim lost it silently: `mkdocs_extra_packages` defaulted to empty,
# so `make book` built the site without the plugin that renders the API reference. Nothing fails
# -- the pages just come out missing their generated content, which is the worst shape for a
# regression to have.
#
# rhiza-task 0.3.1 made `mkdocstrings[python]` the *default*, for the same reason on a wider
# scale: the `book` bundle ships `docs/mkdocs-base.yml` with the plugin enabled, so every
# consumer inherited a config zensical refused to build. This line is therefore no longer a
# fix -- it now states explicitly what the pin already resolves to, which is worth one line
# here because tests/integration/test_docs_targets.py asserts the generated API pages exist
# and this is the setting that names why.
#
# Bare specs, not flags: the CLI passes these as `withs=`, adding `--with` itself.
mkdocs-extra-packages = ["mkdocstrings[python]"]

[tool.mypy]
# `make typecheck` passes both the strictness flag and the paths on the command line
# (`mypy --strict $TYPECHECK_FOLDERS`), so this table does not drive CI — it makes a
# *bare* `mypy` measure the same thing CI does (#1507). Without it the two disagreed:
# the gate checked utils/ in strict mode while a contributor's `uvx mypy` swept the
# whole tree at default strictness and reported on code this repo does not gate.
#
# Keep `files` in step with [tool.rhiza-task].source-folder, and `strict`
# in step with the `--strict` in python.mk's typecheck recipe. tests/ is deliberately
# absent from both: ruff exempts test code from ANN (see ruff.toml's per-file-ignores),
# so the annotations strict mode would demand are not there by design.
strict = true
files = ["utils"]

[tool.interrogate]
# The same job [tool.mypy] does above, for the same reason (#1535). The interrogate hook
# in .pre-commit-config.yaml has always passed `--config=pyproject.toml`, and this table
# has never existed — interrogate falls back to its own defaults for a missing table
# rather than failing, so the hook silently enforced fail-under 80 with magic and
# __init__ methods counted, where `make docs-coverage` enforces 100 with both ignored.
# A hook that is weaker than the gate it shadows is worse than no hook: it passes on
# work the gate will reject.
#
# Keep these in step with the flags in python.mk's docs-coverage recipe
# (`interrogate -vv --fail-under 100 --ignore-init-method --ignore-magic`). No `paths`
# key: the hook is handed the files it matched, and the gate passes DOCSTRING_FOLDERS on
# the command line, so neither reads a path from here.
fail-under = 100
ignore-init-method = true
ignore-magic = true

[tool.check_test_layout]
# Rhiza ships configuration templates, not a runtime library: there is no `src/` tree,
# so there is no module for a `tests/<path>/test_<name>.py` to mirror and never will be.
# Without this table the checker reports all 56 test files as orphans of `src/...`
# modules that were never meant to exist (#1513) — a 56-line failure whose only correct
# reading is "does not apply", re-derived by hand every time someone runs it.
#
# The suite is organised by the invariant under test instead: tests/bundles/ for the
# bundle contract, tests/api/ for the Make target surface, tests/e2e/ per language layer.
# What guarantees coverage here is not per-module parity but that every bundle and every
# gate is exercised behaviourally — see tests/bundles/test_bundle_test_coverage.py.
enforce = false
reason = "Rhiza ships configuration templates, not a runtime library: there is no src/ tree to mirror. Tests are organised by the invariant under test (bundles, Make API, per-layer e2e), and bundle/gate coverage is enforced by tests/bundles/test_bundle_test_coverage.py."

[tool.deptry.package_module_name_map]
# uvx runs deptry without the project deps installed, so it cannot read each
# package's metadata to resolve the import module name. Declaring the mappings
# explicitly silences the "Assuming the corresponding module name ..." warnings.
pyyaml = "yaml"
pytest = "pytest"
defusedxml = "defusedxml"
packaging = "packaging"
marimo = "marimo"
numpy = "numpy"
plotly = "plotly"
pandas = "pandas"

[tool.coverage.report]
# `make test` now measures COVERAGE_FOLDERS rather than a hard-coded SOURCE_FOLDER
# (#1516), which brought utils/ under the coverage gate for the first time. These are
# the conventional non-executable exclusions; without them the `__main__` guard at the
# foot of each script counts as a missed statement it is not possible to cover from a
# test that imports the module.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
