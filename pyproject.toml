[project]
name = "rhiza"
version = "1.2.5"
description = "Reusable configuration templates for modern Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Thomas Schmelzer" }
]
keywords = ["templates", "configuration", "ci", "ruff"]
classifiers = [
    # Deliberate PyPI kill-switch: rhiza_release.yml skips publish when this classifier is present.
    # Remove it to enable publishing (after configuring PyPI Trusted Publisher for the repository).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[dependency-groups]
lint = [
    #"ruff>=0.4,<1.0",
    #"interrogate>=1.7,<2.0",
    #"pre-commit>=3.7,<5.0",
]
test = [
    "pytest>=9,<10",
    "python-dotenv>=1,<2",
    "pyyaml>=6.0.1,<7.0",
    "defusedxml>=0.7,<1",
    "packaging>=26,<27",
]
docs = [
    # Declared so deptry can resolve the notebook imports in docs/notebooks/.
    # The notebook also pins these via its PEP 723 header.
    "marimo>=0.18.0,<1.0",   # Reactive notebook runtime for book/ examples (v0.18+ for streaming, <1.0 for API stability)
    "numpy>=2.4.0,<3.0",     # Numerical computing for notebook data analysis (v2.4+ includes 2.0 improvements, <3.0 avoids breaking changes)
    "plotly>=6.5.0,<7.0",    # Interactive visualization in notebooks (v6.5+ mature features, <7.0 for API stability)
    "pandas>=3,<3.1",        # Data manipulation for notebook examples (v3+ for modern APIs, <3.1 conservative after major release)
]
typecheck = [
    # Type checkers for `make typecheck` (uv run ty / mypy). Formerly shipped in
    # .rhiza/requirements/tools.txt; kept here as a dependency group.
    "ty>=0.0.30",
    "mypy==2.3.0",
    "typer==0.27.0",
]

[project.urls]
Homepage = "https://github.com/jebel-quant/rhiza"
Repository = "https://github.com/jebel-quant/rhiza"
Issues = "https://github.com/jebel-quant/rhiza/issues"

[tool.bumpversion]
# Authoritative list of every location this repo's own version is written.
# bump-my-version rewrites ONLY the patterns declared here, so a dependency that
# happens to share the version number is never touched. Kept in pyproject.toml
# because that is one of the four filenames bump-my-version auto-discovers
# (.bumpversion.toml, .bumpversion.cfg, setup.cfg, pyproject.toml) — a block
# anywhere else is inert, and inert is silent: with no config found the tool falls
# back to `git describe` rather than failing. That is issue #1453, which is why the
# python-core bundle no longer ships a `.rhiza/.cfg.toml` copy of this block; the
# Rust and Go layers ship a root `.bumpversion.toml` instead, since neither
# language has a discoverable file of its own.
current_version = "1.2.5"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:[-]?(?P<release>[a-z]+)[\\.]?(?P<pre_n>\\d+))?(?:\\+build\\.(?P<build_n>\\d+))?"
serialize = [
    "{major}.{minor}.{patch}-{release}.{pre_n}+build.{build_n}",
    "{major}.{minor}.{patch}+build.{build_n}",
    "{major}.{minor}.{patch}-{release}.{pre_n}",
    "{major}.{minor}.{patch}",
]
allow_dirty = false
# The release flow commits and tags itself (so the changelog lands in the same
# commit as the bump), so bump-my-version must not do either.
commit = false
tag = false

[tool.bumpversion.parts.release]
optional_value = "prod"
values = ["dev", "alpha", "a", "beta", "b", "rc", "prod"]

# Anchored to the [project] table: an unanchored `version = "..."` search would
# also rewrite any [tool.*] table that happens to share the current number.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
regex = true
search = '(?ms)^\[project\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[project]\1version = "{new_version}"'

# The live workflows under .github/workflows/ are deliberately NOT listed, and
# neither is any pin of jebel-quant/actions. configure-git-auth lives in that
# separate repo now, pinned by commit SHA, so it carries ITS version, not this
# repo's — a glob here would rewrite an unrelated project's SHA on every bump.
#
# A self-referential pin is what made releases self-blocking before: the branch
# push published workflows referencing a tag of THIS repo that did not exist yet,
# so they failed at `Set up job` and a release PR could never turn its required
# checks green. Pointing at a different repo removes that circularity — the SHA
# already exists when the release commit lands — but only as long as nothing
# below rewrites it.
#
# The bundle stubs synced into downstream repos must reference an existing tag.
[[tool.bumpversion.files]]
glob = "bundles/**/.github/workflows/*.yml"
regex = true
search = '(jebel-quant/rhiza/[^@\s]+)@v\d+\.\d+\.\d+'
replace = '\1@v{new_version}'
ignore_missing_version = true

# uv.lock is deliberately absent: its `name = "rhiza"` entry is regenerated with
# `uv lock` after the bump. A search on the bare version string would also
# rewrite any dependency pinned at the same number (python-dotenv is at 1.2.2).

[tool.deptry.package_module_name_map]
# uvx runs deptry without the project deps installed, so it cannot read each
# package's metadata to resolve the import module name. Declaring the mappings
# explicitly silences the "Assuming the corresponding module name ..." warnings.
pyyaml = "yaml"
pytest = "pytest"
python-dotenv = "dotenv"
defusedxml = "defusedxml"
packaging = "packaging"
marimo = "marimo"
numpy = "numpy"
plotly = "plotly"
pandas = "pandas"
ty = "ty"
mypy = "mypy"
typer = "typer"
