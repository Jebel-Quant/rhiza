# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Docker
#
# Purpose: Lint docker/Dockerfile with hadolint, build the image for validation,
#          and scan it for security vulnerabilities with Trivy.
#
# Trigger: On push and pull_request to main/master.

name: "(RHIZA) DOCKER"

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker:
    uses: jebel-quant/rhiza/.github/workflows/rhiza_docker.yml@v1.8.0
    # Forwarded explicitly: `secrets: inherit` only reaches a reusable workflow in the
    # caller's own organisation or enterprise (#1689). The build receives them as BuildKit
    # secrets, never as build args (#1691); a secret this repository has not defined
    # arrives empty and the image builds exactly as it did without one.
    secrets:
      GH_PAT: ${{ secrets.GH_PAT }}
      UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
    permissions:
      contents: read
      security-events: write
