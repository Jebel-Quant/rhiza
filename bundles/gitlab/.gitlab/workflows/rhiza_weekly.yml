# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Weekly (GitLab CI)
#
# Purpose: Slower checks deferred to a weekly schedule:
#
#   weekly:semgrep    — Semgrep static analysis (numpy rules).
#   weekly:link-check — Verifies hyperlinks in README.md are reachable.
#                       Also runs on push/MR when README.md changes.
#
# Trigger: Scheduled pipeline (configure weekly in GitLab CI/CD Schedules),
#          or manually via the web UI.

#
# RHIZA_TASK is the pin every gate below runs through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now. `core` ships a `Makefile`
# that forwards to the CLI, but this pipeline calls the CLI directly so it does not depend
# on a front door it neither ships nor can verify.

variables:
  RHIZA_TASK: "rhiza-task@1.6.0"

weekly:semgrep:
  stage: test
  needs: []
  image: $UV_IMAGE
  script:
    - export UV_EXTRA_INDEX_URL="${UV_EXTRA_INDEX_URL}"
    - uvx "$RHIZA_TASK" semgrep
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
      allow_failure: true
