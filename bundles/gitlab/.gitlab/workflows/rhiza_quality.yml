# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Quality (GitLab CI)
#
# Purpose: Run quality checks including dependency validation, pre-commit hooks,
#          documentation coverage, and link checking.
#
# Trigger: This workflow runs on every push and on merge requests to main/master
#          branches (including from forks)
#
# Equivalent GitHub Action: .github/workflows/rhiza_quality.yml

#
# RHIZA_TASK is the pin every gate below runs through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now. `core` ships a `Makefile`
# that forwards to the CLI, but this pipeline calls the CLI directly so it does not depend
# on a front door it neither ships nor can verify.

variables:
  RHIZA_TASK: "rhiza-task@1.3.1"

quality:deptry:
  stage: test
  needs: []
  image: $UV_IMAGE
  script:
    - uvx "$RHIZA_TASK" deps
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

quality:pre-commit:
  stage: test
  needs: []
  image: $UV_IMAGE
  script:
    - uvx "$RHIZA_TASK" fmt
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

quality:docs-coverage:
  stage: test
  needs: []
  image: $UV_IMAGE
  variables:
    UV_EXTRA_INDEX_URL: "${UV_EXTRA_INDEX_URL}"
  script:
    - uvx "$RHIZA_TASK" docs-coverage
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
