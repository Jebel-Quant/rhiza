# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# bump-my-version configuration for a Rust project.
#
# WHY IT LIVES AT THE ROOT (issue #1453). bump-my-version auto-discovers exactly
# four filenames — .bumpversion.toml, .bumpversion.cfg, setup.cfg, pyproject.toml —
# and reads nothing else unless it is handed --config-file explicitly. This config
# used to ship as `.rhiza/.cfg.toml`, which is not one of them, so it never took
# effect. That failure is silent by construction: finding no config, the tool does
# not error, it falls back to `git describe` and reports the last reachable tag as
# the current version.
#
# WHY THERE IS NO `current_version`. This file is synced from rhiza, so it must not
# carry a value only the consuming repo can own — the next `/rhiza:update` would
# reset it. Omitting the key makes bump-my-version derive the current version from
# the newest tag matching `tag_name` below, which is the value Cargo.toml carries in
# any repo whose crate version and tags agree. Should they ever disagree, the
# [package] search below fails loudly ("did not find current version") rather than
# rewriting the wrong line.

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<release>[a-z]+)\\.(?P<pre_n>\\d+))?"
serialize = ["{major}.{minor}.{patch}-{release}.{pre_n}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
sign_tags = false
# Load-bearing even with `tag = false`: with no `current_version` key above, this is
# also the pattern bump-my-version matches tags against when it reads the current
# version from git.
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Chore: bump version {current_version} → {new_version}"
commit_args = ""
# The release flow commits and tags itself, so the changelog lands in the same commit
# as the bump; bump-my-version must do neither. `/rhiza:release` passes
# --no-commit --no-tag anyway, but a bare `bump-my-version bump patch` would
# otherwise produce a second commit and a duplicate tag.
tag = false
commit = false
# Cargo.lock records the crate's own version, so bumping only Cargo.toml leaves a
# stale lockfile and the next `cargo build` dirties the tree. `--offline` keeps the
# hook from hitting the network just to rewrite one line. Despite the name these run
# even when `commit = false` — they are "before the commit", not "only if committing".
pre_commit_hooks = ["cargo update --workspace --offline", "git add Cargo.lock"]

# SemVer pre-releases, not PEP 440: Cargo rejects "1.2.3-a.1" style short forms,
# so the value list is the spelled-out set only.
[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "beta",
    "rc",
    "prod"
]

# Anchored to the [package] table on purpose. `search`/`replace` are applied to
# EVERY occurrence in the file, so an unanchored `version = "{current_version}"`
# would also rewrite a [dependencies] entry that happens to share the number.
[[tool.bumpversion.files]]
filename = "Cargo.toml"
regex = true
search = '(?ms)^\[package\]((?:(?!^\[)[\s\S])*?)^version = "{current_version}"'
replace = '[package]\1version = "{new_version}"'

# Cargo.lock is deliberately NOT listed as a file here. It records the crate's own
# version *and* every dependency's, and bump-my-version applies `search` to every
# occurrence in a file — so an entry for it would rewrite any dependency pinned at
# the same number as the crate. The `cargo update --workspace` pre-commit hook
# above is the safe way to refresh it: cargo knows which entry is ours.
