# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Book (GitLab CI)
#
# Purpose: This workflow builds and deploys comprehensive documentation for the project.
#          It combines API documentation, test coverage reports, test results, and
#          interactive notebooks into a single GitLab Pages site.
#
# Trigger: This workflow runs on every push to the main or master branch
#
# Components:
#   - 📓 Process Marimo notebooks
#   - 📖 Build documentation site via zensical
#   - 🧪 Run tests and generate coverage reports
#   - 🚀 Deploy combined documentation to GitLab Pages

# The LaTeX engine `book`'s `paper` prerequisite needs. Without it that prerequisite skips
# -- `skipped  paper  tectonic not found` -- and `book` still reports ok, so the site
# deploys with the paper in its nav and no such asset: a 404 in the book's own navigation,
# green the whole way. Installed only when the project has a paper. Pinned and managed by a
# custom manager in the mother repo's renovate.json.
variables:
  TECTONIC_VERSION: "0.17.0"

pages:
  stage: deploy
  needs: []
  image: $UV_IMAGE
  variables:
    GIT_LFS_SKIP_SMUDGE: "0"
  before_script:
    - apt-get update && apt-get install -y git-lfs make
    - git lfs pull
    - export UV_EXTRA_INDEX_URL="${UV_EXTRA_INDEX_URL}"
    - |
      # The musl build: statically linked, so it runs in whatever container $UV_IMAGE is.
      folder=$(uvx rhiza-task@1.6.0 print paper-folder)
      if [ -n "$(find "${folder}" -maxdepth 1 -name '*.tex' 2>/dev/null | head -1)" ]; then
        url="https://github.com/tectonic-typesetting/tectonic/releases/download"
        url="${url}/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        curl -fsSL "$url" -o /tmp/tectonic.tar.gz
        tar xzf /tmp/tectonic.tar.gz -C /usr/local/bin tectonic
        tectonic --version
      fi
  script:
    - |
      # Build the book. SOURCE_DATE_EPOCH keeps the paper the book publishes
      # byte-identical between builds of one revision -- tectonic otherwise embeds the
      # build time in the PDF `/ID`.
      SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
      export SOURCE_DATE_EPOCH

      make book

      # zensical reports `No issues found` for a nav entry whose target does not exist, so
      # this is the only check that asks whether what was *published* holds together. It is
      # deliberately not a prerequisite of `book` -- a project that cannot build its paper
      # locally must still be able to build its book -- so the deploying pipeline names it.
      make book-nav

      # GitLab Pages expects artifacts in the "public" directory
      # Move _book to public for GitLab Pages
      mv _book public

      # Create .nojekyll file if not present
      touch public/.nojekyll
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"
