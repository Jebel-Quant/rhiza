# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# bump-my-version configuration for a Go project.
#
# WHY IT LIVES AT THE ROOT (issue #1453). bump-my-version auto-discovers exactly
# four filenames — .bumpversion.toml, .bumpversion.cfg, setup.cfg, pyproject.toml —
# and reads nothing else unless it is handed --config-file explicitly. This config
# used to ship as `.rhiza/.cfg.toml`, which is not one of them, so it never took
# effect. That failure is silent by construction: finding no config, the tool does
# not error, it falls back to `git describe` and reports the last reachable tag as
# the current version.
#
# WHY THERE IS NO `current_version`. This file is synced from rhiza, so it must not
# carry a value only the consuming repo can own — the next `/rhiza:update` would
# reset it. Omitting the key makes bump-my-version derive the current version from
# the newest tag matching `tag_name` below. For a Go module that is not a fallback
# but the truth: the module version *is* the git tag, and the `Version` constant
# below exists only so a built binary can report it.

[tool.bumpversion]
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<release>[a-z]+)\\.(?P<pre_n>\\d+))?"
serialize = ["{major}.{minor}.{patch}-{release}.{pre_n}", "{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
sign_tags = false
# Load-bearing even with `tag = false`: with no `current_version` key above, this is
# also the pattern bump-my-version matches tags against when it reads the current
# version from git.
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
message = "Chore: bump version {current_version} → {new_version}"
commit_args = ""
# The release flow commits and tags itself, so the changelog lands in the same commit
# as the bump; bump-my-version must do neither. `/rhiza:release` passes
# --no-commit --no-tag anyway, but a bare `bump-my-version bump patch` would
# otherwise produce a second commit and a duplicate tag.
tag = false
commit = false
# No pre-commit hooks, unlike the Rust layer: go.sum records the checksums of
# *dependencies* only, never the module's own version, so nothing needs
# refreshing after a bump.

# SemVer pre-releases, not PEP 440: Go module tags must be valid SemVer, so the
# value list is the spelled-out set only ("1.2.3-a.1" is not a legal tag).
[tool.bumpversion.parts.release]
optional_value = "prod"
values = [
    "dev",
    "alpha",
    "beta",
    "rc",
    "prod"
]

# The one place a Go module's version exists in the source tree. Go takes the
# module version from the git tag, so without this constant there is no file for
# bump-my-version to write to and `tag`-only bumping would leave the built binary
# unable to report its own version.
#
# The search is a literal `const Version = "..."` line rather than a bare version
# string: `search` is applied to every occurrence in the file, and anchoring on the
# declaration keeps a version that appears in a doc comment or an example from
# being rewritten too.
[[tool.bumpversion.files]]
filename = "internal/version/version.go"
search = 'const Version = "{current_version}"'
replace = 'const Version = "{new_version}"'
