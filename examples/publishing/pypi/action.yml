name: Publish verified distributions to PyPI
description: Optional consumer-owned publisher; copy to .github/actions/release-publish/action.yml.
inputs:
  artifacts-dir:
    description: Absolute directory containing verified release artifacts.
    required: true
  tag:
    description: Validated release tag.
    required: true
  version:
    description: Release version without the leading v.
    required: true
  credentials:
    description: Optional PyPI API token; omit for Trusted Publishing in a directly triggered workflow.
    required: false
outputs:
  artifact-url:
    description: Public project release page, only after a successful upload.
    value: ${{ steps.link.outputs.artifact-url }}
  public-pypi:
    description: Signal for optional public PyPI consumers such as Conda recipe generation.
    value: ${{ steps.link.outputs.public-pypi }}
runs:
  using: composite
  steps:
    - name: Prepare distributions
      id: prepare
      shell: bash
      env:
        ARTIFACTS_DIR: ${{ inputs.artifacts-dir }}
      run: |
        python3 - <<'PY'
        import os
        import shutil
        import tempfile
        import tomllib
        from pathlib import Path

        project = tomllib.loads(Path('pyproject.toml').read_text())['project']
        if 'Private :: Do Not Upload' in project.get('classifiers', []):
            raise SystemExit('Refusing to publish a Private :: Do Not Upload package to PyPI')
        files = [p for p in Path(os.environ['ARTIFACTS_DIR']).iterdir()
                 if p.is_file() and p.name.endswith(('.whl', '.tar.gz'))]
        if not files:
            raise SystemExit('No built distributions to publish')
        # Docker actions can access the workspace, not arbitrary runner temp paths.
        staging = Path(tempfile.mkdtemp(prefix='.pypi-dist-', dir=os.environ['GITHUB_WORKSPACE']))
        for source in files:
            shutil.copyfile(source, staging / source.name)
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print(f'directory={staging.relative_to(Path(os.environ["GITHUB_WORKSPACE"]))}', file=output)
        PY
    - name: Upload distributions
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: ${{ steps.prepare.outputs.directory }}/
        password: ${{ inputs.credentials }}
        skip-existing: true
    - name: Report published package
      id: link
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        python3 - <<'PY'
        import os
        import tomllib
        from pathlib import Path
        from urllib.parse import quote

        name = tomllib.loads(Path('pyproject.toml').read_text())['project']['name']
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            print(f'artifact-url=https://pypi.org/project/{quote(name, safe="")}/{quote(os.environ["VERSION"], safe="")}/', file=output)
            print('public-pypi=true', file=output)
        PY
