# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Paper
#
# Purpose: Compile the LaTeX paper (docs/paper/*.tex) to a PDF and publish
#          it as a downloadable workflow artifact.
#          Only active when a *.tex file exists under docs/paper/.
#
# Trigger: On push and pull requests to main/master branches, or whenever
#          files under docs/paper/ change.  Also supports manual dispatch.

name: "(RHIZA) PAPER"

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/paper/**'
      - '.github/workflows/rhiza_paper.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/paper/**'
      - '.github/workflows/rhiza_paper.yml'
  workflow_dispatch:
  workflow_call:

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    # No `contents: write`: the write scope existed solely for the retired branch push.
    # The workflow-level `contents: read` above is all that compiling and uploading needs.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect docs/paper/*.tex presence
        id: check_tex
        run: |
          if compgen -G "docs/paper/*.tex" > /dev/null 2>&1; then
            echo "tex_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "tex_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no docs/paper/*.tex present)
        if: ${{ steps.check_tex.outputs.tex_present != 'true' }}
        run: echo "No docs/paper/*.tex found; skipping LaTeX compilation."

      - name: Install TeX Live
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-bibtex-extra \
            latexmk

      - name: Detect paper entry point
        id: detect_tex
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        run: |
          # Prefer basanos.tex if it exists; otherwise pick the first *.tex file found.
          if [ -f docs/paper/basanos.tex ]; then
            tex_file="basanos.tex"
          else
            tex_file=$(find docs/paper -maxdepth 1 -name "*.tex" | head -1 | xargs basename)
          fi
          pdf_file="${tex_file%.tex}.pdf"
          echo "tex_file=${tex_file}" >> "$GITHUB_OUTPUT"
          echo "pdf_file=${pdf_file}" >> "$GITHUB_OUTPUT"

      - name: Compile LaTeX document
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        working-directory: docs/paper
        run: |
          latexmk -pdf -interaction=nonstopmode "${{ steps.detect_tex.outputs.tex_file }}"

      - name: Upload PDF artifact
        if: ${{ steps.check_tex.outputs.tex_present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.detect_tex.outputs.pdf_file }}
          path: docs/paper/${{ steps.detect_tex.outputs.pdf_file }}
          retention-days: 30

      # The PDF used to be pushed to an orphan `paper` branch as well. That step is gone
      # (issue #1494): `refs/heads/paper` cannot coexist with `refs/heads/paper/anything`,
      # so the push failed outright in any repository using the branch prefix a
      # paper-writing team most naturally reaches for -- and it stayed broken after such a
      # branch was merged, until it was also deleted.
      #
      # Renaming the target would have moved the collision rather than removed it, and
      # would have broken every consumer just as thoroughly while leaving a stale PDF
      # behind on the old branch. The branch is no longer needed either way: `book` gained
      # `paper` as a prerequisite in rhiza-task 1.1.0 and `paper_folder` sits inside
      # `docs_dir`, so the PDF ships as a site asset at a stable URL, guarded by
      # `book-nav` plus test_the_compiled_paper_is_reachable_from_the_book. The run
      # artifact above covers the ephemeral case.
      - name: Note a lingering paper branch
        if: ${{ steps.check_tex.outputs.tex_present == 'true' && github.event_name != 'pull_request' }}
        run: |
          # A branch this workflow used to write is now nobody's job to update. Say so
          # rather than leaving it to rot: silence here is exactly how a consumer ends up
          # linking a PDF that stopped changing without anything going red.
          if git ls-remote --exit-code --heads origin refs/heads/paper >/dev/null 2>&1; then
            msg="The 'paper' branch is no longer updated by this workflow (rhiza #1494)."
            msg="${msg} The compiled PDF is published by the book instead, and by the run"
            msg="${msg} artifact above. Delete the branch once nothing links to it:"
            msg="${msg} git push origin --delete paper"
            echo "::warning title=Stale paper branch::${msg}"
          fi
