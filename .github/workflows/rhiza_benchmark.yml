# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Benchmarks
#
# Purpose: Run the benchmark suite on pushes to main to create a measurable
#          performance baseline over time.
#
# Trigger: This workflow runs on pushes to the main branch.

name: "(RHIZA) BENCHMARK"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Hook jobs inherit the caller's permissions; OIDC consumers must opt in there.
# No default id-token grant is made for dependency setup.

# The rhiza-task pin the gate step below runs through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now -- and while `core` does
# ship a `Makefile` that forwards to the CLI, calling the CLI directly drops the dependency
# on a front door this workflow does not ship and cannot verify. Pinned rather than read
# from a consumer's `RHIZA_TASK`, which this workflow cannot see: it tracks the tag the
# workflow is called at.
env:
  RHIZA_TASK: rhiza-task@1.8.1

on:
  push:
    branches:
      - main
  workflow_call:
    secrets:
      RHIZA_SETUP_CREDENTIALS:
        required: false
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Validate consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ] ||
             { [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$CALLER_REPOSITORY" ]; }; then
            echo "::error::Consumer setup is not allowed on fork pull requests or pull_request_target."
            exit 1
          fi
          if [ ! -f .github/actions/rhiza-setup/action.yml ] && [ ! -f .github/actions/rhiza-setup/action.yaml ]; then
            echo "::error::RHIZA_SETUP_ENABLED=true requires .github/actions/rhiza-setup/action.yml or action.yaml."
            exit 1
          fi

      - name: Run consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        uses: ./.github/actions/rhiza-setup
        with:
          purpose: ${{ github.job }}
          credentials: ${{ secrets.RHIZA_SETUP_CREDENTIALS }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run benchmarks
        timeout-minutes: 20
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        run: |
          START=$(date +%s)
          uvx "$RHIZA_TASK" benchmark
          echo "Benchmark run: $(($(date +%s) - START))s" >> "$GITHUB_STEP_SUMMARY"
