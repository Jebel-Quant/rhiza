# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Docker
#
# Purpose: Lint the Dockerfile with hadolint, build the image with Docker Buildx,
#          and scan it for vulnerabilities with Trivy. The image is built locally
#          for validation only and is never pushed to a registry. Fails on
#          CRITICAL or HIGH severity vulnerabilities.
#
# Private dependencies: GH_PAT and UV_EXTRA_INDEX_URL reach the build as BuildKit secrets,
#          not build args, so they exist only for the `uv sync` instruction and land in no
#          image layer (#1691). The runner-side `configure-git-auth` step the other
#          workflows use cannot help here: a build stage has its own filesystem, and a
#          `git config --global` on the runner is invisible inside it.
#
# Trigger: On push to main/master and pull requests when Dockerfile or workflow changes.

name: "(RHIZA) DOCKER"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:
    secrets:
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # Needed to upload the Trivy SARIF report to code scanning

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Detect docker/Dockerfile presence
        id: check_dockerfile
        run: |
          if [ -f docker/Dockerfile ]; then
            echo "docker_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (no docker/Dockerfile present)
        if: ${{ steps.check_dockerfile.outputs.docker_present != 'true' }}
        run: echo "No docker/Dockerfile found; skipping hadolint and image build."

      - name: Lint Dockerfile with hadolint
        if: ${{ steps.check_dockerfile.outputs.docker_present == 'true' }}
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: docker/Dockerfile
          # Declared rather than left to the action. Its own default is `info`
          # (hadolint-action's action.yml at this pin), so the commented-out line this
          # replaces described behaviour the step did not have: every info-level style
          # finding failed the job, including two DL3066s in the Dockerfile the template
          # itself ships (#1651). Findings below the threshold are still printed and still
          # annotate the diff through the action's problem matcher. A consumer that wants
          # them fatal, or wants a rule ignored, commits its own `.hadolint.yaml`.
          failure-threshold: error

      - name: Set up Docker Buildx
        if: ${{ steps.check_dockerfile.outputs.docker_present == 'true' }}
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read Python version from .python-version
        if: ${{ steps.check_dockerfile.outputs.docker_present == 'true' }}
        id: python_version
        run: |
          if [ -f .python-version ]; then
            PYTHON_VERSION=$(tr -d '[:space:]' < .python-version)
            echo "version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
            echo "Using Python version: $PYTHON_VERSION"
          else
            echo "version=3.12" >> "$GITHUB_OUTPUT"
            echo "::warning::.python-version not found, using default 3.12"
          fi

      - name: Build container image with Docker Buildx (validation only)
        id: docker_build
        if: ${{ steps.check_dockerfile.outputs.docker_present == 'true' }}
        env:
          # Forwarded into the build as secrets (see the header). An undefined secret is an
          # empty variable, which BuildKit mounts as an empty file, and the Dockerfile's
          # `[ -s ... ]` guard leaves the build exactly as it was.
          GH_PAT: ${{ secrets.GH_PAT }}
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          # Derive image tag from repository name and sanitize (remove '.' and '_')
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          REPO_NAME="${REPO_NAME//[._]/}"
          docker buildx build \
            --file docker/Dockerfile \
            --build-arg PYTHON_VERSION=${{ steps.python_version.outputs.version }} \
            --secret id=gh_pat,env=GH_PAT \
            --secret id=uv_extra_index_url,env=UV_EXTRA_INDEX_URL \
            --tag "${REPO_NAME}:ci" \
            --load \
            .
          echo "image_name=${REPO_NAME}:ci" >> "$GITHUB_OUTPUT"

      - name: Scan Docker Image with Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        if: ${{ steps.check_dockerfile.outputs.docker_present == 'true' }}
        with:
          image-ref: '${{ steps.docker_build.outputs.image_name }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'  # Don't fail on vulnerabilities - rely on SARIF upload to GitHub Security
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Gated on the scan having produced the file rather than on the Dockerfile being
      # present: `always()` alone ran these after a failed lint or build, when Trivy had
      # been skipped and `trivy-results.sarif` does not exist, so one info-level hadolint
      # finding produced a second red step reading `Path does not exist` (#1651). The
      # `always()` is still needed -- without it a *later* step's failure would suppress
      # the upload of a scan that did run.
      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always() && steps.trivy.outcome == 'success'
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Upload Trivy scan results as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.trivy.outcome == 'success'
        with:
          name: trivy-docker-report
          path: trivy-results.sarif
