# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Book
# Purpose: This workflow builds and deploys comprehensive documentation for the project.
#          It combines API documentation, test coverage reports, test results, and
#          interactive notebooks into a single GitHub Pages site.
#
# Trigger: The build runs on every push (and via workflow_call), so every commit
#          validates that the book still builds. The deploy job publishes to
#          GitHub Pages only from the repository's default branch and never from
#          a fork; feature branches build and upload an artifact but never publish.
#
# Components:
#   - 📓 Process Marimo notebooks
#   - 📖 Build documentation site via zensical
#   - 🧪 Run tests and generate coverage reports
#   - 🚀 Deploy combined documentation to GitHub Pages

name: "(RHIZA) BOOK"

on:
  push:
    branches:
      - main
      - master
  workflow_call:
    inputs:
      deploy-pages:
        description: >-
          Deploy the generated book to GitHub Pages. Set to `false` for
          artifact-only mode: the generic `book` artifact is still uploaded so a
          consumer-owned job can download it and deploy to another static host
          (Cloudflare Pages, Azure Static Web Apps, S3/CloudFront, an internal
          web server, ...). See docs/guides/BOOK.md for an example.
        type: boolean
        default: true

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The rhiza-task pin the gate step below runs through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now -- and while `core` does
# ship a `Makefile` that forwards to the CLI, calling the CLI directly drops the dependency
# on a front door this workflow does not ship and cannot verify. Pinned rather than read
# from a consumer's `RHIZA_TASK`, which this workflow cannot see: it tracks the tag the
# workflow is called at.
env:
  RHIZA_TASK: rhiza-task@1.5.0

  # The LaTeX engine `book`'s `paper` prerequisite needs. Without it that prerequisite
  # *skips* -- `skipped  paper  tectonic not found` -- and `book` still reports ok, so the
  # site deployed with `- Paper: paper/rhiza.pdf` in its nav and no such asset: a 404 in the
  # book's own navigation, green the whole way. Installed conditionally below, so a
  # repository with no paper pays nothing for it. Pinned and Renovate-managed for the reason
  # rhiza_paper.yml gives.
  TECTONIC_VERSION: "0.17.0"

jobs:
  # Build the book on every commit (any branch). This proves the documentation
  # site still builds and uploads it as an artifact; it publishes nothing. It
  # deliberately declares no environment so it stays runnable on every branch
  # even when the github-pages environment restricts deployments to one branch.
  build:
    if: ${{ !github.event.repository.fork }}
    runs-on: "ubuntu-latest"

    permissions:
      contents: read

    steps:
      # Check out the repository code
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: "Sync the virtual environment for ${{ github.repository }}"
        shell: bash
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          # will just use .python-version?
          uv sync --all-extras --all-groups --frozen

      - name: Cache MkDocs plugin cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .cache/plugin/
          key: mkdocs-plugin-${{ runner.os }}-${{ hashFiles('mkdocs.yml', 'uv.lock', 'pyproject.toml') }}
          restore-keys: |
            mkdocs-plugin-${{ runner.os }}-

      # `book` takes `paper` as a prerequisite, and the PDF needs no copy step: tectonic
      # writes it beside its source and `paper_folder` sits inside `docs_dir`, so mkdocs
      # sweeps it up as a site asset. That only works if the engine is here.
      - name: Look for a paper
        id: paper
        run: |
          folder=$(uvx "$RHIZA_TASK" print paper-folder)
          if compgen -G "${folder}/*.tex" > /dev/null 2>&1; then
            echo "tex_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "tex_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install tectonic
        if: ${{ steps.paper.outputs.tex_present == 'true' }}
        run: |
          # The musl build: statically linked, so it needs nothing from the runner image.
          # Inlined rather than shared with rhiza_paper.yml because a reusable workflow
          # cannot reach a local composite action in the repository that defines it.
          url="https://github.com/tectonic-typesetting/tectonic/releases/download"
          url="${url}/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" -o /tmp/tectonic.tar.gz
          sudo tar xzf /tmp/tectonic.tar.gz -C /usr/local/bin tectonic
          tectonic --version

      - name: Cache the tectonic bundle
        if: ${{ steps.paper.outputs.tex_present == 'true' }}
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/tectonic
          key: tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-${{ hashFiles('docs/paper/**/*.tex') }}
          restore-keys: |
            tectonic-${{ runner.os }}-${{ env.TECTONIC_VERSION }}-

      - name: "Make the book"
        timeout-minutes: 10
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          # Same reason as rhiza_paper.yml: tectonic embeds the build time in the PDF `/ID`,
          # so without this the paper the book publishes differs on every build. Here the cost
          # is not commit churn but a site asset whose bytes change for no reason, which
          # defeats caching and makes two builds of one revision impossible to compare.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH

          START=$(date +%s)
          uvx "$RHIZA_TASK" book
          echo "Docs build: $(($(date +%s) - START))s" >> "$GITHUB_STEP_SUMMARY"

      # Upload the book as a downloadable workflow artifact (on every commit).
      # This lets anyone download the built documentation directly from GitHub
      # Actions without needing to run a full local build.
      - name: Upload book as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: _book/
          retention-days: 30

      # zensical reports `No issues found` for a nav entry whose target does not exist, so
      # nothing upstream of here notices a dangling one. This is the only gate that asks
      # about what was *published* rather than about the source, and it is deliberately not
      # a prerequisite of `book`: half a repository's nav resolves only after the gates that
      # produce it have run, so a consumer who cannot build its paper locally must still be
      # able to build its book.
      #
      # Placed after the artifact upload and before the Pages upload: a broken nav still
      # leaves a downloadable book to inspect, and never reaches the deploy job.
      - name: Check every nav entry resolves in the built book
        run: uvx "$RHIZA_TASK" book-nav

      # Package the site as a Pages artifact so the deploy job can publish it.
      # Uploading on every commit is cheap; only the deploy job ever consumes it.
      # Skipped in artifact-only mode: a consumer passing `deploy-pages: false`
      # downloads the generic `book` artifact above and deploys it themselves.
      - name: Upload static files as artifact
        if: ${{ github.event_name != 'workflow_call' || inputs.deploy-pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book/  # Path to the directory containing all artifacts to deploy

  # Publish to GitHub Pages only from the default branch, and never from a fork.
  # Referencing the github-pages environment here (not in build) keeps the build
  # job runnable on every branch even when the environment restricts deployments.
  # Skipped entirely in artifact-only mode -- see the input definition above.
  deploy:
    needs: build
    if: >-
      (github.event_name != 'workflow_call' || inputs.deploy-pages) &&
      github.ref_name == github.event.repository.default_branch &&
      !github.event.repository.fork
    runs-on: "ubuntu-latest"

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      contents: read
      pages: write            # Permission to deploy to Pages
      id-token: write         # Permission to verify deployment origin

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Deploys the Pages artifact built by the `build` job in this same run.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        continue-on-error: true
