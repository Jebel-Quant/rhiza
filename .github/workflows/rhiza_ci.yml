# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Continuous Integration
#
# Purpose: Run tests on multiple Python versions, check dependencies, run
#          pre-commit hooks, verify documentation coverage, validate the
#          project, run security scans, and check license compliance.
#
# Python version matrix source of truth:
# - Generated by hynek/build-and-inspect-python-package
# - Reads `Programming Language :: Python :: 3.x` classifiers from package metadata
# - Adding/removing classifiers updates CI Python coverage automatically
#
# Trigger: On push and pull_request.

name: "(RHIZA) CI"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

# The rhiza-task pin every gate step below runs through. `make <gate>` was the old
# interface, and v1.4.0 retired the synced make layer: `.rhiza/rhiza.mk` and the sixteen
# fragments became CLI tasks. `core` ships the front door again -- a `Makefile` that
# forwards to a pinned CLI -- but CI does not go through it, and the reason is the pin
# below rather than the file's absence. This workflow cannot see a consumer's `RHIZA_TASK`
# and must not: the gates a build runs would otherwise move under it. Not depending on a
# front door also survives a repo that has not synced one yet -- Jebel-Quant/greeks#118,
# where a sync deleted the Makefile in the interval when the CLI generated it and nothing
# regenerated it, and every gate died with `No rule to make target 'test'`.
#
# Pinned here rather than read from a consumer's `RHIZA_TASK`, which this workflow cannot
# see -- and should not: the gates a build runs must not move under it. It tracks the tag
# this workflow is called at, the same rule the OS-matrix step below states for its pin.
env:
  RHIZA_TASK: rhiza-task@1.6.0

on:
  push:
  pull_request:
  workflow_call:
    secrets:
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  generate-matrix:
    # CI budget: ≤5 min (matrix generation/setup). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions-output.outputs.list }}
      os_matrix: ${{ steps.os.outputs.list }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - id: versions
        name: Build package metadata and extract supported Python classifiers
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

      - id: versions-output
        run: |
          echo "list=${{ steps.versions.outputs.supported_python_classifiers_json_array }}" >> "$GITHUB_OUTPUT"

      - name: Debug matrix
        run: |
          echo "Python versions: ${{ steps.versions-output.outputs.list }}"

      # The matrix comes from the rhiza-task CLI rather than from
      # `make -f .rhiza/rhiza.mk -s ci-os-matrix`, which is what this step used to run.
      # Naming that path made a *file* part of the contract, and a consumer that has
      # replaced the make layer with the CLI then has to keep a stub `.rhiza/rhiza.mk`
      # alive for this one step and nothing else. Nothing changes for a repo still on
      # the synced make layer: the CLI reads the same layers make did, and core ships no
      # `.rhiza/.env` of its own, so neither reader starts from a template-owned value.
      #
      # The version is pinned here rather than read from a consumer's `RHIZA_TASK`,
      # which this workflow cannot see — and should not: the matrix a build runs on must
      # not move under it. It tracks the tag this workflow is called at.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      # This workflow serves double duty: it runs on push/PR here, and it is the
      # reusable workflow every consumer's `github-tests` stub delegates to. So the
      # OS matrix has to differ by caller (#1526). Rhiza ships Makefiles and shell
      # recipes to macOS users, and validating them on Linux alone left BSD-userland
      # portability untested — but forcing macos-latest on every consumer would spend
      # their minutes to buy *this* repo's assurance. The mother repo therefore opts
      # itself in and leaves the shipped default alone; a consumer who wants the same
      # coverage declares ci-os-matrix in its own pyproject.toml `[tool.rhiza-task]`
      # table. That works whichever layer the consumer is on, because this step reads
      # through the CLI — `rhiza.mk` itself does not parse the table, so a make-layer
      # consumer setting it there gets the CI matrix and not `make ci-os-matrix`.
      #
      # The empty branch below is what hands the question to a consumer's own
      # configuration — its `.rhiza/.env` (layer 2) or its `[tool.rhiza-task]` table
      # (layer 3) — and it relies on rhiza-task treating an empty setting as unset. That is make's
      # `$(or ...)` rule, which the CLI applies to every setting rather than to this one
      # alone (Jebel-Quant/rhiza-task#4) — hence the 0.1.2 pin: 0.1.1 resolved the empty
      # string to a value and answered `[]`, which GitHub expands to zero jobs rather than
      # failing, so `test` would vanish and CI would go green having run nothing.
      #
      # One caveat this step used to carry is gone rather than merely restated. Under make,
      # an assignment in `.rhiza/.env` outranked an exported environment variable (only a
      # command-line `make VAR=...` beat the file), so a value pinned there silently
      # discarded whatever this step exported — which is how the split below was dead code
      # from #1526 until #1545 removed the pin. rhiza-task resolves in the opposite order:
      # `.rhiza/.env` is layer 2 and the environment is layer 4, so the export wins and the
      # file answers only when nothing is exported. Verified both ways.
      - id: os
        env:
          RHIZA_CI_OS_MATRIX: >-
            ${{ github.repository == 'jebel-quant/rhiza'
                && '["ubuntu-latest","macos-latest"]' || '' }}
        run: |
          OS_MATRIX=$(uvx rhiza-task@1.6.0 ci-os-matrix)
          echo "list=$OS_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Debug OS matrix
        run: |
          echo "OS versions: ${{ steps.os.outputs.list }}"

  test:
    # CI budget: ≤20 min (test matrix execution). Last measured: 2026-05-28.
    timeout-minutes: 20
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        os: ${{ fromJson(needs.generate-matrix.outputs.os_matrix) }}
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install uv
        id: install-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Retry uv installation
        if: steps.install-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Cache uv artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run tests
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        shell: bash
        run: |
          uvx "$RHIZA_TASK" test

      - name: Verify clean working tree
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "Working tree is dirty after the test gate:"
            printf '%s\n' "$status"
            git diff --exit-code || true
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: _tests/coverage.xml
          if-no-files-found: ignore


  lowest-deps:
    name: Lowest-direct dependency compatibility
    # CI budget: ≤20 min (dependency compatibility test run). Last measured: 2026-05-28.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Runs the project's own pytest suite, so a repo whose fixtures are LFS-tracked
          # needs the content here for the same reason `test` does. Passing there and
          # failing here on identical tests reads as a resolution problem, which is the
          # one thing this job exists to report.
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install project with lowest-direct resolution
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uv sync --all-extras --all-groups --resolution lowest-direct

      - name: Run tests with lowest-direct resolution
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uv run --all-extras --all-groups --resolution lowest-direct pytest tests -q --ignore=tests/stress --ignore=tests/benchmarks

  typecheck:
    name: Type checking (Python ${{ matrix.python-version }})
    # CI budget: ≤5 min (lint/typecheck quality gate). Last measured: 2026-05-28.
    timeout-minutes: 5
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run ty and mypy type checkers (typecheck gate)
        # Runs `uv run ty check <source>` and `uv run mypy --strict <source>`
        # as defined by rhiza-task's `typecheck` task. Set TYPECHECKER=ty or
        # TYPECHECKER=mypy to run only one of the two checkers.
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" typecheck

  deptry:
    name: Check dependencies with deptry
    # CI budget: ≤5 min (lint/dependency hygiene check). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run deptry
        run: uvx "$RHIZA_TASK" deps

  rhiza-test:
    name: Rhiza repository checks
    # Runs the conformance checks `make rhiza-test` selects through RHIZA_CHECKS — the
    # [project] structure gate, doctests, README validation and the release-tag check.
    # `make all` has always named this target, but no CI job invoked it (#1523), so those
    # assertions ran only on a developer's machine and constrained nobody else.
    #
    # The job needs network on a cold runner, and always did: the checks arrive as the
    # pinned pytest-rhiza dependency since #1540, where before they were synced files whose
    # pytest came from `uv run --with` anyway. One resolve either way.
    # CI budget: ≤5 min (small, dependency-light suite). Last measured: 2026-08-15.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # README validation executes the ```python fences, and a consumer's example
          # reads the demo data that ships with the repo. Without this the pointer file
          # reaches the reader and the check dies on content, not on the repo being wrong
          # -- polars reports `parquet: File out of specification: The file must end with
          # PAR1`. The `test` job above has always had it; this job is newer (#1523) and
          # runs project code the same way, so it needs the same checkout.
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      # RHIZA_DOCTEST_FOLDERS is exported rather than left to pytest-rhiza's own
      # fallback, which is SOURCE_FOLDER in `.rhiza/.env` and then the literal `src`.
      # rhiza-task does not pass its resolved `source_folder` through to the check
      # (Jebel-Quant/rhiza-task#18), so without this `test_docstrings` reports
      #
      #   SKIPPED  No doctest folder found (looked for: src)
      #
      # while the gate still exits 0 -- #1517 exactly: doctest examples unchecked behind a
      # green gate. The mother repo's Makefile wraps the target for this reason, but that
      # wrapper is repo-owned and no consumer ever had it, so every consumer running this
      # workflow had the silent skip. Doing it here fixes it for all of them at once.
      - name: Run the rhiza repository checks
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          RHIZA_DOCTEST_FOLDERS="$(uvx "$RHIZA_TASK" print source_folder)" \
            uvx "$RHIZA_TASK" rhiza-test

  pre-commit:
    name: Pre-commit hooks
    # CI budget: ≤5 min (lint/format hooks). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      # This job deliberately had no setup-uv step: `ubuntu-latest` ships no uv, and the
      # shim's `$(UVX)` rule bootstrapped it as a prerequisite of every target, so
      # `make fmt` worked on a bare runner. Reaching the CLI directly means the binary has
      # to be there already -- without this step the job fails with `uvx: command not found`.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Cache prek environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Run prek
        run: |
          uvx "$RHIZA_TASK" fmt

  docs-coverage:
    # CI budget: ≤10 min (docs quality check). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check docs coverage
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          uvx "$RHIZA_TASK" docs-coverage

  security:
    name: Security scanning
    # CI budget: ≤10 min (security scanning and suppression audit). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run security scans
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" security

  license:
    name: License compliance scan
    # CI budget: ≤10 min (license and artifact generation). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run license check
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" license

      - name: Generate LICENSES.md
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          uv run --with pip-licenses pip-licenses --format markdown --output-file LICENSES.md

      - name: Upload LICENSES.md
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LICENSES.md
          path: LICENSES.md
          if-no-files-found: ignore

  ci-gate:
    name: CI gate
    # Roll-up gate: a single required status check that aggregates the test,
    # typecheck, lowest-deps and rhiza-test jobs. Branch protection requires this
    # context instead of every per-leg name, so the matrix can change without editing
    # the ruleset — which is why rhiza-test joined here rather than as a seventh
    # required context (#1523): the roll-up is the mechanism that exists for exactly
    # this, and adding a context would mean editing the ruleset, its bundle copy and
    # the sync test that pins the `ci / ` prefix between them.
    # CI budget: ≤5 min (result aggregation only). Last measured: 2026-06-27.
    timeout-minutes: 5
    if: always()
    needs: [test, typecheck, lowest-deps, rhiza-test]
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Verify test, typecheck, lowest-deps and rhiza-test succeeded
        run: |
          echo "test result:        ${{ needs.test.result }}"
          echo "typecheck result:   ${{ needs.typecheck.result }}"
          echo "lowest-deps result: ${{ needs.lowest-deps.result }}"
          echo "rhiza-test result:  ${{ needs.rhiza-test.result }}"
          # Accept "success" or "cancelled" (transient runner cancellation).
          # Reject "failure" (real failure) and "skipped" (job never ran).
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "cancelled" \
             || "${{ needs.typecheck.result }}" != "success" && "${{ needs.typecheck.result }}" != "cancelled" \
             || "${{ needs.lowest-deps.result }}" != "success" && "${{ needs.lowest-deps.result }}" != "cancelled" \
             || "${{ needs.rhiza-test.result }}" != "success" && "${{ needs.rhiza-test.result }}" != "cancelled" ]]; then
            echo "::error::test, typecheck, lowest-deps and/or rhiza-test did not succeed; failing the CI gate."
            exit 1
          fi
          echo "All required CI jobs succeeded."
