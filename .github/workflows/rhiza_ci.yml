# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Continuous Integration
#
# Purpose: Run tests on multiple Python versions, check dependencies, run
#          pre-commit hooks, verify documentation coverage, validate the
#          project, run security scans, and check license compliance.
#
# Python version matrix source of truth:
# - Generated by hynek/build-and-inspect-python-package
# - Reads `Programming Language :: Python :: 3.x` classifiers from package metadata
# - Adding/removing classifiers updates CI Python coverage automatically
#
# Trigger: On push and pull_request.

name: "(RHIZA) CI"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

on:
  push:
  pull_request:
  workflow_call:
    secrets:
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  generate-matrix:
    # CI budget: ≤5 min (matrix generation/setup). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions-output.outputs.list }}
      os_matrix: ${{ steps.os.outputs.list }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - id: versions
        name: Build package metadata and extract supported Python classifiers
        uses: hynek/build-and-inspect-python-package@2abe76da66d0a6a4a227101f9348ee855797cfa5 # v3.0.1

      - id: versions-output
        run: |
          echo "list=${{ steps.versions.outputs.supported_python_classifiers_json_array }}" >> "$GITHUB_OUTPUT"

      - name: Debug matrix
        run: |
          echo "Python versions: ${{ steps.versions-output.outputs.list }}"

      # This workflow serves double duty: it runs on push/PR here, and it is the
      # reusable workflow every consumer's `github-tests` stub delegates to. So the
      # OS matrix has to differ by caller (#1526). Rhiza ships Makefiles and shell
      # recipes to macOS users, and validating them on Linux alone left BSD-userland
      # portability untested — but forcing macos-latest on every consumer would spend
      # their minutes to buy *this* repo's assurance. The mother repo therefore opts
      # itself in and leaves the shipped default alone; a consumer who wants the same
      # coverage sets RHIZA_CI_OS_MATRIX in its own .rhiza/.env.
      #
      # An empty value is not the same as an unset one to make's `?=`, which treats an
      # exported empty string as set — hence `ci-os-matrix` resolves through
      # `$(or ...)`, so the empty branch below falls back to ["ubuntu-latest"].
      - id: os
        env:
          RHIZA_CI_OS_MATRIX: >-
            ${{ github.repository == 'jebel-quant/rhiza'
                && '["ubuntu-latest","macos-latest"]' || '' }}
        run: |
          OS_MATRIX=$(make -f .rhiza/rhiza.mk -s ci-os-matrix)
          echo "list=$OS_MATRIX" >> "$GITHUB_OUTPUT"

      - name: Debug OS matrix
        run: |
          echo "OS versions: ${{ steps.os.outputs.list }}"

  test:
    # CI budget: ≤20 min (test matrix execution). Last measured: 2026-05-28.
    timeout-minutes: 20
    needs: generate-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
        os: ${{ fromJson(needs.generate-matrix.outputs.os_matrix) }}
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install uv
        id: install-uv
        continue-on-error: true
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Retry uv installation
        if: steps.install-uv.outcome == 'failure'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Cache uv artifacts
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Run tests
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        shell: bash
        run: |
          make test

      - name: Verify clean working tree
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          status="$(git status --porcelain)"
          if [[ -n "$status" ]]; then
            echo "Working tree is dirty after make test:"
            printf '%s\n' "$status"
            git diff --exit-code || true
            exit 1
          fi

      - name: Upload coverage report
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: _tests/coverage.xml
          if-no-files-found: ignore


  lowest-deps:
    name: Lowest-direct dependency compatibility
    # CI budget: ≤20 min (dependency compatibility test run). Last measured: 2026-05-28.
    timeout-minutes: 20
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Install project with lowest-direct resolution
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uv sync --all-extras --all-groups --resolution lowest-direct

      - name: Run tests with lowest-direct resolution
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uv run --all-extras --all-groups --resolution lowest-direct pytest tests -q --ignore=tests/stress --ignore=tests/benchmarks

  typecheck:
    name: Type checking (Python ${{ matrix.python-version }})
    # CI budget: ≤5 min (lint/typecheck quality gate). Last measured: 2026-05-28.
    timeout-minutes: 5
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"
          python-version: ${{ matrix.python-version }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run ty and mypy type checkers (make typecheck)
        # Runs `uv run ty check src/` and `uv run mypy --strict src/`
        # as defined in .rhiza/make.d/test.mk. Set TYPECHECKER=ty or
        # TYPECHECKER=mypy to run only one of the two checkers.
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: make typecheck

  deptry:
    name: Check dependencies with deptry
    # CI budget: ≤5 min (lint/dependency hygiene check). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run deptry
        run: make deps

  rhiza-test:
    name: Rhiza template tests
    # Runs the suite the template syncs into .rhiza/tests/ — the [project] structure
    # gate, docstring coverage, README validation and release-tag checks. `make all`
    # has always named this target, but no CI job invoked it (#1523), so those
    # assertions ran only on a developer's machine and constrained nobody else.
    # CI budget: ≤5 min (small, dependency-light suite). Last measured: 2026-08-15.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run the shipped .rhiza/tests suite
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: make rhiza-test

  pre-commit:
    name: Pre-commit hooks
    # CI budget: ≤5 min (lint/format hooks). Last measured: 2026-05-28.
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Cache prek environments
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-prek-

      - name: Run prek
        run: |
          make fmt

  docs-coverage:
    # CI budget: ≤10 min (docs quality check). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Check docs coverage
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          make docs-coverage

  security:
    name: Security scanning
    # CI budget: ≤10 min (security scanning and suppression audit). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run security scans
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: make security

  license:
    name: License compliance scan
    # CI budget: ≤10 min (license and artifact generation). Last measured: 2026-05-28.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run license check
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: make license

      - name: Generate LICENSES.md
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          uv run --with pip-licenses pip-licenses --format markdown --output-file LICENSES.md

      - name: Upload LICENSES.md
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LICENSES.md
          path: LICENSES.md
          if-no-files-found: ignore

  ci-gate:
    name: CI gate
    # Roll-up gate: a single required status check that aggregates the test,
    # typecheck, lowest-deps and rhiza-test jobs. Branch protection requires this
    # context instead of every per-leg name, so the matrix can change without editing
    # the ruleset — which is why rhiza-test joined here rather than as a seventh
    # required context (#1523): the roll-up is the mechanism that exists for exactly
    # this, and adding a context would mean editing the ruleset, its bundle copy and
    # the sync test that pins the `ci / ` prefix between them.
    # CI budget: ≤5 min (result aggregation only). Last measured: 2026-06-27.
    timeout-minutes: 5
    if: always()
    needs: [test, typecheck, lowest-deps, rhiza-test]
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Verify test, typecheck, lowest-deps and rhiza-test succeeded
        run: |
          echo "test result:        ${{ needs.test.result }}"
          echo "typecheck result:   ${{ needs.typecheck.result }}"
          echo "lowest-deps result: ${{ needs.lowest-deps.result }}"
          echo "rhiza-test result:  ${{ needs.rhiza-test.result }}"
          # Accept "success" or "cancelled" (transient runner cancellation).
          # Reject "failure" (real failure) and "skipped" (job never ran).
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "cancelled" \
             || "${{ needs.typecheck.result }}" != "success" && "${{ needs.typecheck.result }}" != "cancelled" \
             || "${{ needs.lowest-deps.result }}" != "success" && "${{ needs.lowest-deps.result }}" != "cancelled" \
             || "${{ needs.rhiza-test.result }}" != "success" && "${{ needs.rhiza-test.result }}" != "cancelled" ]]; then
            echo "::error::test, typecheck, lowest-deps and/or rhiza-test did not succeed; failing the CI gate."
            exit 1
          fi
          echo "All required CI jobs succeeded."
