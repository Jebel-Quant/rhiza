# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: CodeQL
#
# Purpose: Automated code scanning for Python and GitHub Actions using
#          GitHub's CodeQL engine. Free for public repositories; requires
#          GitHub Advanced Security for private repositories.
#          Set the CODEQL_ENABLED repository variable to 'true' to force-enable
#          on private repos, 'false' to disable, or leave unset for auto-detect.
#
# Trigger: On push to main/master, pull requests, weekly schedule and manual
#          dispatch. Under the `lean` and `standard` CI profiles
#          ([tool.rhiza.ci].profile in pyproject.toml) the analysis skips on pull
#          requests; see docs/guides/CI_PROFILES.md.

name: "(RHIZA) CODEQL"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '27 1 * * 1'
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_PAT:
        required: false

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The CI profile gate (#1744). `on:` triggers cannot read pyproject.toml, so this
  # cheap job resolves `[tool.rhiza.ci].profile` and every expensive job below needs
  # it: under `lean` and `standard` they skip on pull requests and still run on
  # pushes, the schedule and manual dispatch. `comprehensive` -- the default when the
  # table is absent -- runs on pull requests exactly as before. An invalid profile
  # fails this job, as it fails rhiza_ci.yml's planner, rather than quietly running
  # less. Inline for the planner's reason: a reusable call must run its pinned code,
  # not code from the consumer checkout.
  #
  # It carries the CODEQL_ENABLED condition `analyze` used to, so a repository with
  # CodeQL switched off spends no runner on the gate either.
  profile:
    name: CI profile
    if: |
      vars.CODEQL_ENABLED == 'true' ||
      (vars.CODEQL_ENABLED != 'false' && github.event.repository.visibility == 'public')
    permissions:
      contents: read
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
      run: ${{ steps.profile.outputs.run }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Resolve CI profile
      id: profile
      shell: python
      run: |
        import json
        import os
        import tomllib
        from pathlib import Path

        # BEGIN ci-profile resolution. Copied verbatim into the profile gates of
        # rhiza_codeql.yml and rhiza_marimo.yml; tests/api/test_ci_profiles.py
        # fails if any copy differs from this one.
        with Path("pyproject.toml").open("rb") as stream:
            project = tomllib.load(stream)
        config = project.get("tool", {}).get("rhiza", {}).get("ci", {})
        if not isinstance(config, dict) or set(config) - {"profile"}:
            raise SystemExit("[tool.rhiza.ci] accepts only profile")
        profile = config.get("profile", "comprehensive")
        if profile not in ("lean", "standard", "comprehensive"):
            raise SystemExit("CI profile must be lean, standard or comprehensive")
        # END ci-profile resolution
        event_name = os.environ["GITHUB_EVENT_NAME"]
        run = profile == "comprehensive" or event_name not in ("pull_request", "pull_request_target")
        with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
            output.write(f"profile={profile}\nrun={json.dumps(run)}\n")
        print(json.dumps({"profile": profile, "event": event_name, "run": run}))

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: profile
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    # CodeQL requires GitHub Advanced Security (part of GitHub Enterprise).
    # For users without Enterprise license:
    # - Public repositories: CodeQL is available for free
    # - Private repositories: Requires GitHub Advanced Security
    # To disable this workflow, set CODEQL_ENABLED repository variable to 'false'
    # To enable this workflow for private repos with Advanced Security, set CODEQL_ENABLED to 'true'
    # That condition sits on the `profile` job above; a skipped gate skips this job too.
    if: needs.profile.outputs.run == 'true'
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: python
          build-mode: none
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout repository
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Configure git auth for private packages
      uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
      with:
        token: ${{ secrets.GH_PAT }}

    # Add any setup steps before running the `github/codeql-action/init` action.
    # This includes steps like installing compilers or runtimes (`actions/setup-node`
    # or others). This is typically only required for manual builds.
    # - name: Setup runtime (example)
    #   uses: actions/setup-example@v1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # If the analyze step fails for one of the languages you are analyzing with
    # "We were unable to automatically build your code", modify the matrix above
    # to set the build mode to "manual" for that language. Then modify this step
    # to build your code.
    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsrun
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        echo 'If you are using a "manual" build mode for one or more of the' \
          'languages you are analyzing, replace this with the commands to build' \
          'your code, for example:'
        echo '  make bootstrap'
        echo '  make release'
        exit 1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: "/language:${{matrix.language}}"
