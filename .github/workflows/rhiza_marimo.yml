# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Marimo Notebooks
#
# Purpose: This workflow discovers and executes all Marimo notebooks in the
#          repository. It builds a dynamic matrix to run each notebook in
#          parallel to surface errors early and keep notebooks reproducible.
#
# Trigger: This workflow runs on every push and on pull requests to main/master
#          branches (including from forks)
#
# Components:
#   - 🔎 Discover notebooks in book/marimo
#   - 🧪 Run each notebook in parallel using a matrix strategy
#   - ✅ Fail-fast disabled to report all failing notebooks

name: "(RHIZA) MARIMO"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

jobs:
  # Build a matrix of notebooks to test
  list-notebooks:
    runs-on: ubuntu-latest
    outputs:
      notebook-list: ${{ steps.notebooks.outputs.matrix }}
    steps:
      # Check out the repository code
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Install uv/uvx
      #
      # `test-notebooks` below already installs it. `list-notebooks` did not, because its
      # only dependency was make. Reading the folder from the CLI needs uvx on PATH here
      # too -- the same step #1546 adds to `generate-matrix` in rhiza_ci.yml.
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      # Find all Python files in the marimo folder and create a matrix for parallel execution
      - name: Find notebooks and build matrix
        id: notebooks
        run: |
          # Extract MARIMO_FOLDER from the project configuration, via the rhiza-task CLI.
          #
          # This step used to synthesise a makefile on stdin and read the variable out of
          # make's own namespace, with `marimo` as the fallback. That put two things into
          # the reusable contract that do not belong in it: a root `Makefile`, and
          # MARIMO_FOLDER living inside make's variable namespace. A consumer that has
          # replaced the synced make layer with the CLI satisfies neither by default -- its
          # `Makefile` is template-owned and carries no `-include .rhiza/.env` at all, so
          # there is no supported place to keep one alive purely so this one probe finds
          # something. `rhiza-task print` exists precisely
          # to replace make's `print-%` pattern rule, and reads `.rhiza/.env` itself, so
          # nothing changes for a repository still on the synced make layer.
          #
          # One behaviour change, and it is a convergence rather than a regression: the old
          # fallback was `marimo`, while the CLI's default is `docs/notebooks` -- which is
          # what this repository and the shipped `.rhiza/.env` both use. A consumer that
          # left MARIMO_FOLDER unset *and* keeps notebooks in `marimo/` must now say so;
          # every synced consumer has the value set explicitly and is unaffected.
          #
          # Pinned for the reason the OS matrix is pinned (#1546): the folder a build
          # discovers notebooks in must not move under a workflow called at a tag.
          NOTEBOOK_DIR=$(uvx rhiza-task@0.3.1 print marimo_folder)

          echo "Searching notebooks in: $NOTEBOOK_DIR"
          # Check if directory exists
          if [ ! -d "$NOTEBOOK_DIR" ]; then
            echo "Directory $NOTEBOOK_DIR does not exist. Setting empty matrix."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find notebooks and handle empty results
          if [ -z "$(find "$NOTEBOOK_DIR" -maxdepth 1 -name "*.py" 2>/dev/null)" ]; then
            echo "No notebooks found in $NOTEBOOK_DIR. Setting empty matrix."
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            notebooks=$(find "$NOTEBOOK_DIR" -maxdepth 1 -name "*.py" -print0 | xargs -0 -n1 echo | jq -R -s -c 'split("\n")[:-1]')
            echo "matrix=$notebooks" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  # Create one job per notebook using the matrix strategy for parallel execution
  test-notebooks:
    if: needs.list-notebooks.outputs.notebook-list != '[]'
    runs-on: ubuntu-latest
    needs: list-notebooks
    strategy:
      matrix:
        notebook: ${{ fromJson(needs.list-notebooks.outputs.notebook-list) }}
      # Don't fail the entire workflow if one notebook fails
      fail-fast: false
    name: Run notebook ${{ matrix.notebook }}
    steps:
      # Check out the repository code
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      # Install uv/uvx
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      # Execute the notebook with the appropriate runner based on its content
      - name: Run notebook
        id: artefact-folder
        timeout-minutes: 10
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          notebook="${{ matrix.notebook }}"
          notebook_stem="$(basename "$notebook" .py)"
          artefact_folder="results/${notebook_stem}"
          mkdir -p "${artefact_folder}"
          echo "name=${notebook_stem}" >> "$GITHUB_OUTPUT"
          export NOTEBOOK_OUTPUT_FOLDER="${artefact_folder}"
          uv run --script "$notebook"  # builds env from the notebook's inline /// script header
        shell: bash

      - name: Upload notebook artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: notebook-artefacts-${{ steps.artefact-folder.outputs.name }}
          path: results/${{ steps.artefact-folder.outputs.name }}/
          if-no-files-found: ignore
