# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Weekly
#
# Purpose: Runs checks that are too slow or noisy for every push:
#   dep-compat-test — resolves dependencies fresh (ignoring the lockfile) and
#                     runs the full test suite to catch newly-released packages
#                     that break compatibility before Renovate picks them up.
#   semgrep         — static analysis with project-specific rules.
#   advisories      — audits the committed uv.lock against the PyPI advisory database.
#   ruleset-drift   — compares the live branch-protection ruleset's required checks with
#                     the committed .github/rulesets/main-branch-protection.json.
#   link-check      — verifies all hyperlinks in README.md are reachable.
#   zizmor-online   — zizmor's online audits (known-vulnerable actions, impostor commits),
#                     which the offline pre-commit gate cannot run. Mother repo only.
#
# Trigger: Weekly schedule (Monday 08:00 UTC) and manual dispatch.

name: "(RHIZA) WEEKLY"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The rhiza-task pin the gate steps below run through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now -- and these steps call the
# CLI rather than `core`'s `Makefile` so they do not depend on a front door this workflow
# neither ships nor can verify.
env:
  RHIZA_TASK: rhiza-task@1.11.0

on:
  #push:
  #  branches: [main]
  #  paths: [README.md]
  #pull_request:
  #  paths: [README.md]
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:
  workflow_call:
    secrets:
      RHIZA_SETUP_CREDENTIALS:
        required: false
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  dep-compat-test:
    permissions:
      contents: read
    name: Test with latest compatible dependencies
    timeout-minutes: 30
    runs-on: ubuntu-latest
    #if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.10"

      - name: Validate consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ] ||
             { [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$CALLER_REPOSITORY" ]; }; then
            echo "::error::Consumer setup is not allowed on fork pull requests or pull_request_target."
            exit 1
          fi
          if [ ! -f .github/actions/rhiza-setup/action.yml ] && [ ! -f .github/actions/rhiza-setup/action.yaml ]; then
            echo "::error::RHIZA_SETUP_ENABLED=true requires .github/actions/rhiza-setup/action.yml or action.yaml."
            exit 1
          fi

      - name: Run consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        uses: ./.github/actions/rhiza-setup
        with:
          purpose: ${{ github.job }}
          credentials: ${{ secrets.RHIZA_SETUP_CREDENTIALS }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Resolve and install latest compatible dependencies
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        run: |
          # --upgrade ignores the committed lockfile and resolves the newest
          # versions that satisfy pyproject.toml constraints.
          uv sync --upgrade

      - name: Show resolved package versions
        run: |
          echo "=== Installed package versions ==="
          uv pip list

      - name: Run tests
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" test

  semgrep:
    permissions:
      contents: read
    name: Semgrep (numpy)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.10"

      - name: Validate consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CALLER_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request_target" ] ||
             { [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" != "$CALLER_REPOSITORY" ]; }; then
            echo "::error::Consumer setup is not allowed on fork pull requests or pull_request_target."
            exit 1
          fi
          if [ ! -f .github/actions/rhiza-setup/action.yml ] && [ ! -f .github/actions/rhiza-setup/action.yaml ]; then
            echo "::error::RHIZA_SETUP_ENABLED=true requires .github/actions/rhiza-setup/action.yml or action.yaml."
            exit 1
          fi

      - name: Run consumer dependency setup
        if: ${{ vars.RHIZA_SETUP_ENABLED == 'true' }}
        uses: ./.github/actions/rhiza-setup
        with:
          purpose: ${{ github.job }}
          credentials: ${{ secrets.RHIZA_SETUP_CREDENTIALS }}

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run Semgrep
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL || env.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" semgrep

  # The Python layer's `security` task is bandit, which is SAST: it reads the source and
  # never looks at what is installed. rust-core's `security` runs `cargo deny check
  # advisories` and go-core's runs `govulncheck`, so Python was the one layer where nothing
  # asked whether a pinned dependency has a published advisory -- and GitLab consumers do
  # not get Dependabot alerts either (#1804).
  #
  # Weekly rather than in `security`, for the reason rhiza-task's `security` docstring gives:
  # an advisory published on Tuesday is not the Tuesday author's fault, so gating a pull
  # request on it would fail builds the author cannot fix. A scheduled run is a notification.
  #
  # Deliberately *not* continue-on-error: red is the signal, and on a schedule it blocks
  # nothing. For an advisory with no fixed version, add `--ignore-vuln <ID>` with its reason
  # on the line above, never continue-on-error, which would silence every future one too.
  advisories:
    permissions:
      contents: read
    name: Dependency advisories
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.10"

      # The committed lockfile is the subject, so `--frozen`: resolving afresh would audit
      # versions nobody ships. The export carries hashes, which is what lets pip-audit run
      # with `--disable-pip` -- nothing is resolved or installed, so no consumer setup and
      # no private-index credentials are needed. A private package PyPI has never heard of
      # is reported as not auditable rather than failing the job.
      - name: Export the locked dependencies
        run: >-
          uv export --frozen --all-extras --all-groups --no-emit-project
          --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"

      - name: Audit them against the advisory database
        run: uvx pip-audit --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  # The committed ruleset file changes no live setting: GitHub reads branch protection from
  # repository settings, and the file is only what an admin re-applies with `gh api PUT`.
  # Every test reads the file, so a live ruleset that was never re-applied looks correct
  # everywhere except on GitHub. That happened here (#1817): #1744 and #1813 changed the
  # file's required checks, while the live ruleset kept requiring the five per-job contexts
  # #1744 removed and never required `E2E gate`.
  #
  # Only the required status-check contexts are compared -- the part every rhiza change to
  # the file has been about. The job skips, with a notice, when the repository has no
  # ruleset file or has not applied a ruleset of that name: neither is drift. An API error
  # is not a skip -- it fails the job, so the check cannot go green by measuring nothing.
  ruleset-drift:
    permissions:
      contents: read
    name: Branch-protection ruleset drift
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Reading a ruleset needs only metadata access, which every GITHUB_TOKEN has.
      - name: Fetch the live ruleset
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          RULESET_FILE: .github/rulesets/main-branch-protection.json
        run: |
          set -euo pipefail
          if [ ! -f "$RULESET_FILE" ]; then
            echo "::notice::no $RULESET_FILE in this repository; nothing to compare"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          name=$(basename "$RULESET_FILE" .json)
          ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/rulesets?includes_parents=false" \
            --jq ".[] | select(.name == \"$name\") | .id")
          if [ -z "$ids" ]; then
            echo "::notice::no live ruleset named '$name' is applied; apply it with" \
              "gh api --method POST repos/$GITHUB_REPOSITORY/rulesets --input $RULESET_FILE"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(echo "$ids" | wc -l)" -ne 1 ]; then
            echo "::error::more than one live ruleset is named '$name' ($(echo "$ids" | tr '\n' ' '));" \
              "which one is meant is ambiguous"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/rulesets/$ids" > "$RUNNER_TEMP/live-ruleset.json"
          echo "id=$ids" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Compare the required status checks
        if: steps.fetch.outputs.skip == 'false'
        env:
          RULESET_FILE: .github/rulesets/main-branch-protection.json
          LIVE_FILE: ${{ runner.temp }}/live-ruleset.json
          RULESET_ID: ${{ steps.fetch.outputs.id }}
        shell: python
        run: |
          import json
          import os


          def contexts(path):
              """Return the required status-check contexts a ruleset declares."""
              with open(path, encoding="utf-8") as handle:
                  rules = json.load(handle).get("rules", [])
              for rule in rules:
                  if rule.get("type") == "required_status_checks":
                      checks = rule.get("parameters", {}).get("required_status_checks", [])
                      return sorted(check["context"] for check in checks)
              return []


          committed = contexts(os.environ["RULESET_FILE"])
          live = contexts(os.environ["LIVE_FILE"])
          print(f"committed: {committed}")
          print(f"live:      {live}")
          if committed != live:
              missing = sorted(set(committed) - set(live))
              extra = sorted(set(live) - set(committed))
              print(f"::error::the live ruleset has drifted from {os.environ['RULESET_FILE']}: "
                    f"not required live {missing}, required live but not committed {extra}")
              print("Re-apply it: gh api --method PUT "
                    f"repos/{os.environ.get('GITHUB_REPOSITORY', '<owner>/<repo>')}/rulesets/"
                    f"{os.environ['RULESET_ID']} --input {os.environ['RULESET_FILE']}")
              raise SystemExit(1)
          print("The live ruleset requires exactly the committed status checks.")

  # The `zizmor` pre-commit hook gates every PR, but with --offline so its result does not
  # depend on a GH_TOKEN. That leaves out the audits that need the GitHub API -- known-
  # vulnerable actions, impostor commits, ref confusion -- which are also the ones that
  # change after a workflow is written, when an advisory is published against a pinned
  # action. This job runs them weekly, so a new advisory notifies instead of failing
  # somebody's pull request.
  #
  # Mother repo only: a consumer's rhiza workflows are these files, synced, and are fixed
  # here. The version comes from the hook's `rev`, so Renovate moves both together; the
  # file set is the hook's own `files` pattern. tests/api/test_weekly_zizmor.py pins both.
  zizmor-online:
    if: github.repository == 'jebel-quant/rhiza'
    permissions:
      contents: read
    name: zizmor online audits
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.10"

      - name: Run zizmor with online audits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(awk '/zizmorcore\/zizmor-pre-commit/ {found=1} found && /rev:/ {print $2; exit}' \
            .pre-commit-config.yaml)
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::no zizmor-pre-commit rev in .pre-commit-config.yaml; nothing to pin to"
            exit 1
          fi
          pattern='(^|/)(\.github/(workflows/[^/]+|dependabot)\.ya?ml|action\.ya?ml|\.pre-commit-(config|hooks)\.ya?ml)$'
          mapfile -t files < <(git ls-files | grep -E "$pattern")
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no files match the zizmor hook pattern; the audit would measure nothing"
            exit 1
          fi
          echo "zizmor $version over ${#files[@]} files"
          uvx "zizmor@$version" --no-progress --config .github/zizmor.yml "${files[@]}"

  link-check:
    permissions:
      contents: read
    name: Check links in README.md
    timeout-minutes: 15
    runs-on: ubuntu-latest

    # Both lychee passes below check the same links the same way, so the argument
    # list lives here rather than being written out twice and drifting.
    env:
      LYCHEE_ARGS: >-
        --verbose
        --no-progress
        --accept 200,206,429
        README.md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # lychee's own --max-retries cannot cover a transient 5xx here, so the retry
      # is built out of two passes. `RetryExt for ErrorKind`
      # (lychee-lib/src/retry.rs) retries a *rejected status code* only when it is
      # 429; the is_server_error() branch above it applies to reqwest's own errors,
      # not to a response that arrived intact and failed the --accept list. A 504
      # from github.com is therefore ErrorKind::RejectedStatusCode(504) and fails on
      # the first response, no matter what --max-retries says.
      #
      # A 5xx is also never the failure this job exists to find: a README link to a
      # page that is genuinely gone answers 404, which still fails on the first pass
      # and again on the second. So the first pass reports without deciding, and
      # only a repeat of the failure -- after a pause long enough to outlive a
      # gateway blip -- goes red.
      - name: Check links in README.md
        id: link-check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: false

      - name: Wait before re-checking
        if: steps.link-check.outputs.exit_code != '0'
        run: sleep 30

      - name: Re-check links in README.md
        if: steps.link-check.outputs.exit_code != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true
