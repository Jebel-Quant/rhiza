# This file is part of the jebel-quant/rhiza repository
# (https://github.com/jebel-quant/rhiza).
#
# Workflow: Weekly
#
# Purpose: Runs checks that are too slow or noisy for every push:
#   dep-compat-test — resolves dependencies fresh (ignoring the lockfile) and
#                     runs the full test suite to catch newly-released packages
#                     that break compatibility before Renovate picks them up.
#   semgrep         — static analysis with project-specific rules.
#   link-check      — verifies all hyperlinks in README.md are reachable.
#
# Trigger: Weekly schedule (Monday 08:00 UTC) and manual dispatch.

name: "(RHIZA) WEEKLY"

# Cancel superseded in-progress runs of this workflow for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The rhiza-task pin the gate steps below run through. v1.4.0 retired the synced make
# layer -- `.rhiza/rhiza.mk` and its fragments are CLI tasks now -- and these steps call the
# CLI rather than `core`'s `Makefile` so they do not depend on a front door this workflow
# neither ships nor can verify.
env:
  RHIZA_TASK: rhiza-task@1.7.0

on:
  #push:
  #  branches: [main]
  #  paths: [README.md]
  #pull_request:
  #  paths: [README.md]
  schedule:
    - cron: "0 8 * * 1"  # Every Monday at 08:00 UTC
  workflow_dispatch:
  workflow_call:
    secrets:
      GH_PAT:
        required: false
      UV_EXTRA_INDEX_URL:
        required: false

jobs:
  dep-compat-test:
    name: Test with latest compatible dependencies
    runs-on: ubuntu-latest
    #if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Resolve and install latest compatible dependencies
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: |
          # --upgrade ignores the committed lockfile and resolves the newest
          # versions that satisfy pyproject.toml constraints.
          uv sync --upgrade

      - name: Show resolved package versions
        run: |
          echo "=== Installed package versions ==="
          uv pip list

      - name: Run tests
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" test

  semgrep:
    name: Semgrep (numpy)
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.11.16"

      - name: Configure git auth for private packages
        uses: jebel-quant/actions/configure-git-auth@6d52725ca371d609489c5b50236965ad70bbe528 # v1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Run Semgrep
        env:
          UV_EXTRA_INDEX_URL: ${{ secrets.UV_EXTRA_INDEX_URL }}
        run: uvx "$RHIZA_TASK" semgrep

  link-check:
    name: Check links in README.md
    runs-on: ubuntu-latest

    # Both lychee passes below check the same links the same way, so the argument
    # list lives here rather than being written out twice and drifting.
    env:
      LYCHEE_ARGS: >-
        --verbose
        --no-progress
        --accept 200,206,429
        README.md

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # lychee's own --max-retries cannot cover a transient 5xx here, so the retry
      # is built out of two passes. `RetryExt for ErrorKind`
      # (lychee-lib/src/retry.rs) retries a *rejected status code* only when it is
      # 429; the is_server_error() branch above it applies to reqwest's own errors,
      # not to a response that arrived intact and failed the --accept list. A 504
      # from github.com is therefore ErrorKind::RejectedStatusCode(504) and fails on
      # the first response, no matter what --max-retries says.
      #
      # A 5xx is also never the failure this job exists to find: a README link to a
      # page that is genuinely gone answers 404, which still fails on the first pass
      # and again on the second. So the first pass reports without deciding, and
      # only a repeat of the failure -- after a pause long enough to outlive a
      # gateway blip -- goes red.
      - name: Check links in README.md
        id: link-check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: false

      - name: Wait before re-checking
        if: steps.link-check.outputs.exit_code != '0'
        run: sleep 30

      - name: Re-check links in README.md
        if: steps.link-check.outputs.exit_code != '0'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: ${{ env.LYCHEE_ARGS }}
          fail: true
